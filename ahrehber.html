<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aile Hekimliği Rehberi</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #475569;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Panel: Dizin / Arama */
    #sidebar {
      width: 340px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.2s ease-in-out;
    }

    .search-box {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .content-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(71, 85, 105, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .list-item:hover {
      background-color: var(--bg-card);
    }

    .list-item.active {
      background-color: rgba(56, 189, 248, 0.15);
      border-left: 4px solid var(--primary);
      padding-left: 12px;
    }

    .list-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .page-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-main);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      white-space: nowrap;
    }

    /* Sağ Panel: Görünüm Alanı */
    #viewer-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #0b1120;
    }

    .toolbar {
      height: 52px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      user-select: none;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }

    .btn:hover {
      background: var(--border);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 13px;
      color: var(--text-muted);
      min-width: 80px;
      text-align: center;
    }

    .viewer {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .viewer img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      object-fit: contain;
      transition: transform 0.1s ease;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 12px;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        z-index: 10;
        height: 100%;
        left: -340px;
      }
      #sidebar.open {
        left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Sol Dizin & Arama -->
  <aside id="sidebar">
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Konu başlığı ara..." autocomplete="off">
    </div>
    <ul id="content-list" class="content-list"></ul>
  </aside>

  <!-- Sağ Görüntüleyici -->
  <main id="viewer-container">
    <header class="toolbar">
      <div class="toolbar-left">
        <button id="toggle-sidebar" class="btn" style="display: none;">Menü</button>
        <button id="btn-prev" class="btn" disabled>‹ Önceki</button>
        <span id="page-indicator" class="page-indicator">- / -</span>
        <button id="btn-next" class="btn" disabled>Sonraki ›</button>
      </div>
      <div class="toolbar-right">
        <button id="btn-zoom-out" class="btn">-</button>
        <button id="btn-zoom-reset" class="btn">Sıfırla</button>
        <button id="btn-zoom-in" class="btn">+</button>
      </div>
    </header>

    <section class="viewer" id="viewer">
      <div id="empty-state" class="empty-state">
        <p>Yükleniyor veya içerik bulunamadı.</p>
      </div>
      <img id="page-image" src="" alt="Sayfa Görüntüsü" style="display: none;">
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // Asset Yolları (ahrehberassets klasör yapısı)
      const CONFIG = {
        dataPath: 'ahrehberassets/data/guide.json', // JSON dosya adı farklıysa burayı güncelleyin
        pagesPath: 'ahrehberassets/pages/'
      };

      let state = {
        guideData: [],
        filteredData: [],
        currentIndex: -1,
        zoomLevel: 1.0
      };

      // DOM Referansları
      const dom = {
        sidebar: document.getElementById('sidebar'),
        searchInput: document.getElementById('search-input'),
        contentList: document.getElementById('content-list'),
        pageImage: document.getElementById('page-image'),
        emptyState: document.getElementById('empty-state'),
        pageIndicator: document.getElementById('page-indicator'),
        btnPrev: document.getElementById('btn-prev'),
        btnNext: document.getElementById('btn-next'),
        btnZoomIn: document.getElementById('btn-zoom-in'),
        btnZoomOut: document.getElementById('btn-zoom-out'),
        btnZoomReset: document.getElementById('btn-zoom-reset'),
        toggleSidebar: document.getElementById('toggle-sidebar')
      };

      // Responsive Menü Kontrolü
      if (window.innerWidth <= 768) {
        dom.toggleSidebar.style.display = 'block';
        dom.toggleSidebar.addEventListener('click', () => {
          dom.sidebar.classList.toggle('open');
        });
      }

      // JSON Yükleme & Normalizasyon
      async function init() {
        try {
          const res = await fetch(CONFIG.dataPath);
          if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
          const rawData = await res.json();

          // JSON şeması adaptasyonu (id, title/name, page/image alanlarını normalize et)
          state.guideData = (Array.isArray(rawData) ? rawData : (rawData.items || rawData.pages || [])).map((item, idx) => ({
            id: item.id || idx + 1,
            title: item.title || item.name || item.baslik || `Konu ${idx + 1}`,
            pageFile: normalizeFileName(item.page || item.file || item.image || `${idx + 1}.jpg`)
          }));

          state.filteredData = [...state.guideData];
          renderList();
          
          if (state.guideData.length > 0) {
            selectPage(0);
          }
        } catch (err) {
          console.error('Rehber verisi yüklenemedi:', err);
          dom.emptyState.innerHTML = `<p style="color: #ef4444;">Veriler yüklenemedi. JSON yolunu kontrol edin.<br><small>${CONFIG.dataPath}</small></p>`;
        }
      }

      function normalizeFileName(fileName) {
        if (!fileName) return '1.jpg';
        return fileName.toLowerCase().endsWith('.jpg') ? fileName : `${fileName}.jpg`;
      }

      // Liste Render
      function renderList() {
        dom.contentList.innerHTML = '';
        const fragment = document.createDocumentFragment();

        state.filteredData.forEach((item, index) => {
          const li = document.createElement('li');
          li.className = `list-item ${index === state.currentIndex ? 'active' : ''}`;
          li.innerHTML = `
            <span class="list-title">${item.title}</span>
            <span class="page-badge">${item.pageFile.replace('.jpg', '')}</span>
          `;
          li.addEventListener('click', () => {
            selectPage(index);
            if (window.innerWidth <= 768) dom.sidebar.classList.remove('open');
          });
          fragment.appendChild(li);
        });

        dom.contentList.appendChild(fragment);
      }

      // Sayfa Değiştirme
      function selectPage(index) {
        if (index < 0 || index >= state.filteredData.length) return;

        state.currentIndex = index;
        const currentItem = state.filteredData[index];

        // Resim Güncelleme
        dom.pageImage.src = `${CONFIG.pagesPath}${currentItem.pageFile}`;
        dom.pageImage.style.display = 'block';
        dom.emptyState.style.display = 'none';

        // İndikatör & Buton Durumları
        dom.pageIndicator.textContent = `${index + 1} / ${state.filteredData.length}`;
        dom.btnPrev.disabled = index === 0;
        dom.btnNext.disabled = index === state.filteredData.length - 1;

        // Listede Active Class Güncelleme
        const activeItem = dom.contentList.querySelector('.list-item.active');
        if (activeItem) activeItem.classList.remove('active');
        if (dom.contentList.children[index]) {
          dom.contentList.children[index].classList.add('active');
          dom.contentList.children[index].scrollIntoView({ block: 'nearest' });
        }

        resetZoom();
      }

      // Arama Filtresi (Debounced)
      let debounceTimeout;
      dom.searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(() => {
          const query = e.target.value.toLocaleLowerCase('tr-TR').trim();
          state.filteredData = state.guideData.filter(item => 
            item.title.toLocaleLowerCase('tr-TR').includes(query) ||
            item.pageFile.includes(query)
          );
          state.currentIndex = -1;
          renderList();
          if (state.filteredData.length > 0) {
            selectPage(0);
          } else {
            dom.pageImage.style.display = 'none';
            dom.emptyState.style.display = 'flex';
            dom.emptyState.innerHTML = '<p>Eşleşen başlık bulunamadı.</p>';
            dom.pageIndicator.textContent = '- / -';
            dom.btnPrev.disabled = true;
            dom.btnNext.disabled = true;
          }
        }, 150);
      });

      // Zoom İşlemleri
      function setZoom(val) {
        state.zoomLevel = Math.min(Math.max(val, 0.5), 3.0);
        dom.pageImage.style.transform = `scale(${state.zoomLevel})`;
        dom.pageImage.style.transformOrigin = 'top center';
      }

      function resetZoom() {
        state.zoomLevel = 1.0;
        setZoom(1.0);
      }

      // Event Listeners
      dom.btnPrev.addEventListener('click', () => selectPage(state.currentIndex - 1));
      dom.btnNext.addEventListener('click', () => selectPage(state.currentIndex + 1));
      dom.btnZoomIn.addEventListener('click', () => setZoom(state.zoomLevel + 0.2));
      dom.btnZoomOut.addEventListener('click', () => setZoom(state.zoomLevel - 0.2));
      dom.btnZoomReset.addEventListener('click', resetZoom);

      // Klavye Kısayolları (← / →)
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === dom.searchInput) return;
        if (e.key === 'ArrowLeft') dom.btnPrev.click();
        if (e.key === 'ArrowRight') dom.btnNext.click();
      });

      init();
    })();
  </script>
</body>
</html>
