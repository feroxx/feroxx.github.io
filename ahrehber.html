<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rehber Görüntüleyici</title>
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Panel - Navigasyon */
    #sidebar {
      width: 320px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    #search {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.875rem;
    }

    #search:focus {
      outline: none;
      border-color: var(--primary);
    }

    #menu-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .menu-item {
      padding: 0.6rem 0.75rem;
      margin-bottom: 2px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }

    .menu-item:hover {
      background: #334155;
      color: var(--text-main);
    }

    .menu-item.active {
      background: var(--primary);
      color: #0f172a;
      font-weight: 600;
    }

    .page-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
    }

    /* Sağ Panel - İçerik ve Görsel */
    #viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .toolbar {
      padding: 0.75rem 1.5rem;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-controls button {
      background: #334155;
      border: none;
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      margin-left: 0.25rem;
    }

    .page-controls button:hover:not(:disabled) {
      background: var(--primary-hover);
      color: #0f172a;
    }

    .page-controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .canvas-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
      background: #090d16;
    }

    #guide-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background-color: #1e293b;
      transition: opacity 0.2s ease;
    }

    .loading {
      opacity: 0.4;
    }

    .empty-state {
      margin: auto;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Sol Menü -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1 id="guide-title">Rehber</h1>
      <input type="text" id="search" placeholder="Başlıklarda ara..." />
    </div>
    <div id="menu-tree"></div>
  </aside>

  <!-- Sağ Görsel Alanı -->
  <main id="viewer">
    <div class="toolbar">
      <span id="current-title" style="font-weight: 500;">Bir sayfa seçin</span>
      <div class="page-controls">
        <button id="prev-btn" disabled>← Önceki</button>
        <span id="page-indicator" style="font-size: 0.875rem; margin: 0 0.5rem;">- / -</span>
        <button id="next-btn" disabled>Sonraki →</button>
      </div>
    </div>

    <div class="canvas-container">
      <img id="guide-image" style="display: none;" alt="Rehber Sayfası" />
      <div id="empty-state" class="empty-state">İçerik yükleniyor...</div>
    </div>
  </main>

  <script>
    /**
     * Beklenen JSON yapısı esnek tutulmuştur:
     * 1) Array formatı: [{ "title": "Giriş", "page": "page_1.jpg" }, ...]
     * 2) Obje formatı: { "title": "Rehber Başlığı", "sections": [{ "title": "Bölüm 1", "file": "1.jpg" }] }
     */
    const CONFIG = {
      jsonPath: 'ahrehberassets/data/guide.json',
      pagesDir: 'ahrehberassets/pages/'
    };

    let items = [];
    let currentIndex = -1;

    // DOM Elementleri
    const menuTree = document.getElementById('menu-tree');
    const guideImage = document.getElementById('guide-image');
    const emptyState = document.getElementById('empty-state');
    const currentTitle = document.getElementById('current-title');
    const pageIndicator = document.getElementById('page-indicator');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const searchInput = document.getElementById('search');

    // Veriyi Yükle ve Başlat
    async function init() {
      try {
        const res = await fetch(CONFIG.jsonPath);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const data = await res.json();

        normalizeData(data);
        renderMenu(items);

        if (items.length > 0) {
          selectItem(0);
        } else {
          emptyState.textContent = 'Rehber verisi boş.';
        }
      } catch (err) {
        console.error('Veri yüklenemedi:', err);
        emptyState.textContent = 'guide.json yüklenirken hata oluştu. Lütfen yerel bir HTTP sunucusu (Live Server vb.) üzerinden açtığınızdan emin olun.';
      }
    }

    // JSON Verisini Normalize Et
    function normalizeData(data) {
      if (Array.isArray(data)) {
        items = data.map((d, idx) => ({
          title: d.title || d.name || `Sayfa ${idx + 1}`,
          file: d.page || d.file || d.fileName || `${idx + 1}.jpg`
        }));
      } else if (typeof data === 'object') {
        if (data.title) document.getElementById('guide-title').textContent = data.title;
        const list = data.sections || data.pages || data.items || [];
        items = list.map((d, idx) => ({
          title: d.title || d.name || `Sayfa ${idx + 1}`,
          file: d.page || d.file || d.fileName || `${idx + 1}.jpg`
        }));
      }
    }

    // Menü Render
    function renderMenu(list) {
      menuTree.innerHTML = '';
      list.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = `menu-item ${index === currentIndex ? 'active' : ''}`;
        el.innerHTML = `
          <span>${item.title}</span>
          <span class="page-badge">${item.file.replace('.jpg', '')}</span>
        `;
        el.addEventListener('click', () => {
          const originalIndex = items.findIndex(i => i.file === item.file);
          selectItem(originalIndex);
        });
        menuTree.appendChild(el);
      });
    }

    // Sayfa Seçimi
    function selectItem(index) {
      if (index < 0 || index >= items.length) return;

      currentIndex = index;
      const target = items[index];

      // UI Güncelle
      currentTitle.textContent = target.title;
      pageIndicator.textContent = `${index + 1} / ${items.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === items.length - 1;

      // Aktif Menü Sınıfını Değiştir
      document.querySelectorAll('.menu-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === index);
      });

      // Görseli Yükle
      emptyState.style.display = 'none';
      guideImage.style.display = 'block';
      guideImage.classList.add('loading');

      const fullPath = `${CONFIG.pagesDir}${target.file.replace(/^\//, '')}`;
      guideImage.src = fullPath;
      guideImage.onload = () => guideImage.classList.remove('loading');
      guideImage.onerror = () => {
        guideImage.style.display = 'none';
        emptyState.style.display = 'block';
        emptyState.textContent = `Görsel bulunamadı: ${fullPath}`;
      };
    }

    // Kontroller & Dinleyiciler
    prevBtn.addEventListener('click', () => selectItem(currentIndex - 1));
    nextBtn.addEventListener('click', () => selectItem(currentIndex + 1));

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') selectItem(currentIndex - 1);
      if (e.key === 'ArrowRight') selectItem(currentIndex + 1);
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = items.filter(i => i.title.toLowerCase().includes(term));
      renderMenu(filtered);
    });

    init();
  </script>
</body>
</html>
