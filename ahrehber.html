<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aile Hekimliği Rehberi</title>
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Panel */
    #sidebar {
      width: 340px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    #search {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.875rem;
    }

    #search:focus {
      outline: none;
      border-color: var(--primary);
    }

    #menu-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .menu-item {
      padding: 0.6rem 0.75rem;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s ease;
      background: rgba(255, 255, 255, 0.02);
    }

    .menu-item:hover {
      background: #334155;
      color: var(--text-main);
    }

    .menu-item.active {
      background: var(--primary);
      color: #0f172a;
      font-weight: 600;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .page-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }

    .menu-snippet {
      font-size: 0.75rem;
      color: inherit;
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sağ Panel */
    #viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .toolbar {
      padding: 0.75rem 1.5rem;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-controls button {
      background: #334155;
      border: none;
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      margin-left: 0.25rem;
    }

    .page-controls button:hover:not(:disabled) {
      background: var(--primary-hover);
      color: #0f172a;
    }

    .page-controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .canvas-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
      background: #090d16;
    }

    #guide-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background-color: #1e293b;
      transition: opacity 0.2s ease;
    }

    .loading {
      opacity: 0.3;
    }

    .status-state {
      margin: auto;
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      max-width: 500px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>Rehber İndeksi</h1>
      <input type="text" id="search" placeholder="İçerikte veya sayfada ara..." />
    </div>
    <div id="menu-tree"></div>
  </aside>

  <main id="viewer">
    <div class="toolbar">
      <span id="current-title" style="font-weight: 500;">Sayfa Yükleniyor...</span>
      <div class="page-controls">
        <button id="prev-btn" disabled>← Önceki</button>
        <span id="page-indicator" style="font-size: 0.875rem; margin: 0 0.5rem;">- / -</span>
        <button id="next-btn" disabled>Sonraki →</button>
      </div>
    </div>

    <div class="canvas-container">
      <img id="guide-image" style="display: none;" alt="Rehber Sayfası" />
      <div id="status-state" class="status-state">Rehber verisi yükleniyor...</div>
    </div>
  </main>

  <script>
    // ./ kullanımı HTML'in bulunduğu konuma göre bağıl çözülür
    const CONFIG = {
      jsonPath: './ahrehberassets/data/guide.json',
      pagesDir: './ahrehberassets/pages/'
    };

    let items = [];
    let currentIndex = -1;

    const menuTree = document.getElementById('menu-tree');
    const guideImage = document.getElementById('guide-image');
    const statusState = document.getElementById('status-state');
    const currentTitle = document.getElementById('current-title');
    const pageIndicator = document.getElementById('page-indicator');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const searchInput = document.getElementById('search');

    async function init() {
      try {
        const res = await fetch(CONFIG.jsonPath);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText} (${CONFIG.jsonPath})`);
        }
        const data = await res.json();

        items = data.map((d, idx) => {
          const pageNum = d.page !== undefined ? d.page : idx + 1;
          const imgPath = d.image ? d.image.replace(/^.*[\\\/]/, '') : `page_${pageNum}.jpg`;
          return {
            page: pageNum,
            file: imgPath,
            text: d.text || ''
          };
        });

        renderMenu(items);

        if (items.length > 0) {
          selectItem(0);
        } else {
          statusState.textContent = 'JSON dosyası geçerli fakat içeriği boş.';
        }
      } catch (err) {
        console.error('Yükleme hatası:', err);
        statusState.innerHTML = `
          <strong style="color: #f87171;">Veri Yüklenemedi</strong><br><br>
          İstek yapılan dosya: <code>${CONFIG.jsonPath}</code><br>
          Hata detayı: ${err.message}<br><br>
          <em>Lütfen GitHub reponuzda <code>ahrehberassets/data/guide.json</code> yolunun ve harf büyüklüklerinin tam eşleştiğinden emin olun.</em>
        `;
      }
    }

    function renderMenu(list) {
      menuTree.innerHTML = '';
      if (list.length === 0) {
        menuTree.innerHTML = '<div style="padding: 1rem; color: var(--text-muted); font-size: 0.85rem;">Eşleşen sayfa bulunamadı.</div>';
        return;
      }

      list.forEach((item) => {
        const el = document.createElement('div');
        const originalIndex = items.findIndex(i => i.page === item.page);
        
        el.className = `menu-item ${originalIndex === currentIndex ? 'active' : ''}`;
        
        const previewText = item.text ? item.text.substring(0, 50) + '...' : 'Görsel Sayfa';
        el.innerHTML = `
          <div class="menu-header">
            <span>Sayfa ${item.page}</span>
            <span class="page-badge">#${item.page}</span>
          </div>
          <div class="menu-snippet">${previewText}</div>
        `;
        
        el.addEventListener('click', () => selectItem(originalIndex));
        menuTree.appendChild(el);
      });
    }

    function selectItem(index) {
      if (index < 0 || index >= items.length) return;

      currentIndex = index;
      const target = items[index];

      currentTitle.textContent = `Sayfa ${target.page}`;
      pageIndicator.textContent = `${index + 1} / ${items.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === items.length - 1;

      // Sidebar aktiflik güncellemesi
      document.querySelectorAll('.menu-item').forEach(el => {
        el.classList.toggle('active', el.textContent.includes(`Sayfa ${target.page}`));
      });

      statusState.style.display = 'none';
      guideImage.style.display = 'block';
      guideImage.classList.add('loading');

      const fullImgPath = `${CONFIG.pagesDir}${target.file}`;
      guideImage.src = fullImgPath;

      guideImage.onload = () => guideImage.classList.remove('loading');
      guideImage.onerror = () => {
        guideImage.style.display = 'none';
        statusState.style.display = 'block';
        statusState.innerHTML = `<strong style="color: #f87171;">Görsel Bulunamadı:</strong><br><code>${fullImgPath}</code>`;
      };
    }

    prevBtn.addEventListener('click', () => selectItem(currentIndex - 1));
    nextBtn.addEventListener('click', () => selectItem(currentIndex + 1));

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') selectItem(currentIndex - 1);
      if (e.key === 'ArrowRight') selectItem(currentIndex + 1);
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLocaleLowerCase('tr-TR').trim();
      if (!term) {
        renderMenu(items);
        return;
      }
      const filtered = items.filter(i => 
        i.page.toString().includes(term) || 
        i.text.toLocaleLowerCase('tr-TR').includes(term)
      );
      renderMenu(filtered);
    });

    init();
  </script>
</body>
</html>
