<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Aile Hekimliği Rehberi</title>
  
  <style>
    :root {
      /* Varsayılan Açık Tema */
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: #ffffff;
      --bg-active: #0284c7;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --canvas-bg: radial-gradient(circle at center, #e2e8f0 0%, #cbd5e1 100%);
      --book-bg: #ffffff;
      --book-shadow: 0 16px 36px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.06);
      --spine-shadow: linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.03) 60%, transparent 100%);
      --item-bg: rgba(0, 0, 0, 0.02);
      --item-hover: rgba(0, 0, 0, 0.05);
      --badge-bg: rgba(0, 0, 0, 0.08);
      --badge-color: #334155;
      --header-height: 56px;
      --sidebar-width: 320px;
      --radius: 8px;
    }

    body.dark-theme {
      /* Koyu Tema */
      --bg-main: #0b1120;
      --bg-panel: #131d31;
      --bg-card: #1e293b;
      --bg-active: #0284c7;
      --border-color: #24344d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --canvas-bg: radial-gradient(circle at center, #111a2e 0%, #080c16 100%);
      --book-bg: #1e293b;
      --book-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      --spine-shadow: linear-gradient(to right, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.08) 60%, transparent 100%);
      --item-bg: rgba(255, 255, 255, 0.02);
      --item-hover: rgba(255, 255, 255, 0.06);
      --badge-bg: rgba(0, 0, 0, 0.35);
      --badge-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Sol Menü / Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 50;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      background: var(--bg-panel);
    }

    .sidebar-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
      border-radius: 4px;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .search-box-wrapper {
      position: relative;
      width: 100%;
    }

    #search {
      width: 100%;
      padding: 0.6rem 0.75rem 0.6rem 2.2rem;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .search-icon-svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    #menu-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .menu-item {
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius);
      background-color: var(--item-bg);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
    }

    .menu-item:hover {
      background-color: var(--item-hover);
      border-color: var(--border-color);
    }

    .menu-item.active {
      background-color: var(--bg-active);
      color: #ffffff !important;
      font-weight: 600;
    }

    .menu-item.active .menu-snippet,
    .menu-item.active .page-badge {
      color: #ffffff !important;
      opacity: 0.9;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .page-badge {
      font-size: 0.72rem;
      background: var(--badge-bg);
      color: var(--badge-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }

    .menu-snippet {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* Sağ Sayfa / Viewer Alanı */
    #viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      background-color: var(--bg-main);
    }

    .toolbar {
      height: var(--header-height);
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      z-index: 30;
      gap: 0.75rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .btn-toolbar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      min-height: 36px;
    }

    .btn-toolbar:hover:not(:disabled) {
      background: var(--item-hover);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-toolbar:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-toolbar:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #toggle-menu-btn {
      display: none;
    }

    .doc-title-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #current-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-pill {
      font-size: 0.72rem;
      padding: 2px 8px;
      background: rgba(2, 132, 199, 0.12);
      color: var(--primary);
      border-radius: 9999px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .page-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #page-indicator {
      font-size: 0.875rem;
      padding: 0 0.5rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ─── Gerçekçi 3D Kitap Sahnesi & Sayfa Çevirme & Zoom Motoru ─── */
    .canvas-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background: var(--canvas-bg);
      perspective: 2400px;
      touch-action: none;
      position: relative;
      transition: background 0.2s ease;
      user-select: none;
    }

    .book-stage {
      position: relative;
      max-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      transform-origin: center center;
      will-change: transform;
    }

    .book-wrapper {
      position: relative;
      border-radius: 6px;
      box-shadow: var(--book-shadow);
      background-color: var(--book-bg);
      perspective: 2000px;
      transform-style: preserve-3d;
      user-select: none;
      display: inline-block;
      max-width: 100%;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Sol Cilt Dikiş & Gölgelendirme Derinliği */
    .book-spine-shadow {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 28px;
      background: var(--spine-shadow);
      z-index: 25;
      pointer-events: none;
    }

    .page-image {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - var(--header-height) - 3rem);
      height: auto;
      width: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 4px;
      pointer-events: none;
    }

    /* Alt Sayfa Gölge Katmanı */
    .base-page-shadow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.45s ease;
      background: linear-gradient(to right, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.05) 50%, transparent 100%);
    }

    /* Dönen 3D Yaprak (Flip Leaf) */
    .flip-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 20;
      display: none;
    }

    .flip-overlay.active {
      display: block;
    }

    .flip-leaf {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      overflow: hidden;
      border-radius: 4px;
    }

    .flip-leaf img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      backface-visibility: hidden;
    }

    .flip-lighting-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Gerçekçi İleri Sayfa Çevirme Animasyonu */
    .turn-next-anim {
      animation: realisticFlipNext 0.46s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    }

    @keyframes realisticFlipNext {
      0% {
        transform: rotateY(0deg);
        filter: brightness(1);
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
      35% {
        transform: rotateY(-55deg) scaleY(0.98);
        filter: brightness(0.94);
        box-shadow: -15px 5px 25px rgba(0,0,0,0.25);
      }
      70% {
        transform: rotateY(-125deg) scaleY(0.97);
        filter: brightness(0.86);
        box-shadow: -25px 10px 35px rgba(0,0,0,0.32);
      }
      100% {
        transform: rotateY(-180deg) scaleY(0.96);
        filter: brightness(0.8);
        opacity: 0;
        box-shadow: -35px 15px 45px rgba(0,0,0,0.4);
      }
    }

    /* Gerçekçi Geri Sayfa Çevirme Animasyonu */
    .turn-prev-anim {
      animation: realisticFlipPrev 0.46s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    }

    @keyframes realisticFlipPrev {
      0% {
        transform: rotateY(-180deg) scaleY(0.96);
        filter: brightness(0.8);
        opacity: 0;
        box-shadow: -35px 15px 45px rgba(0,0,0,0.4);
      }
      35% {
        transform: rotateY(-125deg) scaleY(0.97);
        filter: brightness(0.86);
        opacity: 1;
        box-shadow: -25px 10px 35px rgba(0,0,0,0.32);
      }
      70% {
        transform: rotateY(-55deg) scaleY(0.98);
        filter: brightness(0.94);
        box-shadow: -15px 5px 25px rgba(0,0,0,0.25);
      }
      100% {
        transform: rotateY(0deg) scaleY(1);
        filter: brightness(1);
        opacity: 1;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
    }

    /* Durum ve Yükleme Bildirimi */
    .status-state {
      margin: auto;
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Fullscreen Modu */
    body.fs-mode .toolbar {
      display: none;
    }

    body.fs-mode #sidebar {
      display: none;
    }

    body.fs-mode .canvas-container {
      padding: 0;
      background: #000000;
    }

    body.fs-mode .book-wrapper {
      border-radius: 0;
      box-shadow: none;
    }

    body.fs-mode .page-image {
      max-height: 100vh;
      max-width: 100vw;
    }

    .fs-floating-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      align-items: center;
      gap: 12px;
      z-index: 100;
      color: #ffffff;
    }

    body.fs-mode .fs-floating-controls {
      display: flex;
    }

    /* Mobil Duyarlılık (< 768px) */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 85%;
        max-width: 320px;
        transform: translateX(-100%);
        box-shadow: 6px 0 24px rgba(0, 0, 0, 0.4);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      .close-btn {
        display: block;
      }

      #toggle-menu-btn {
        display: inline-flex;
      }

      .category-pill {
        display: none;
      }

      .canvas-container {
        padding: 0.5rem;
      }

      .book-wrapper {
        border-radius: 4px;
      }

      .btn-toolbar {
        padding: 0.4rem 0.55rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Mobil Menü Karartması -->
  <div id="sidebar-overlay"></div>

  <!-- Sol Menü Çekmecesi -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-top">
        <h1>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          Rehber İndeksi
        </h1>
        <button id="close-sidebar-btn" class="close-btn" aria-label="Menüyü Kapat">&times;</button>
      </div>
      <div class="search-box-wrapper">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search" placeholder="Konu veya sayfa ara..." autocomplete="off" />
      </div>
    </div>
    <div id="menu-tree"></div>
  </aside>

  <!-- Sağ Sayfa Alanı (Viewer) -->
  <main id="viewer">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="toggle-menu-btn" class="btn-toolbar" aria-label="Menüyü Aç">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          İndeks
        </button>
        <div class="doc-title-badge">
          <span id="current-title">Yükleniyor...</span>
          <span class="category-pill">Aile Hekimliği Rehberi</span>
        </div>
      </div>

      <div class="page-controls">
        <button id="prev-btn" class="btn-toolbar" title="Önceki Sayfa (Sol Ok)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span id="page-indicator">- / -</span>
        <button id="next-btn" class="btn-toolbar" title="Sonraki Sayfa (Sağ Ok)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <!-- Tema Değiştirme Butonu (Koyu / Açık) -->
        <button id="theme-toggle-btn" class="btn-toolbar" title="Temayı Değiştir (Açık/Koyu)">
          <svg id="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="theme-icon-light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- Tam Ekran Butonu -->
        <button id="fullscreen-btn" class="btn-toolbar" title="Tam Ekran (F)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="canvas-container" id="canvas-container">
      <div class="book-stage" id="book-stage">
        <div class="book-wrapper" id="book-wrapper" style="display: none;">
          <img id="guide-image" class="page-image" alt="Rehber Sayfası" />
          <div class="book-spine-shadow"></div>
          <div class="base-page-shadow" id="base-shadow"></div>

          <div class="flip-overlay" id="flip-overlay">
            <div class="flip-leaf" id="flip-leaf">
              <img id="flip-image" alt="" />
              <div class="flip-lighting-overlay" id="flip-light"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="status-state" class="status-state">
        <div class="loading-spinner"></div>
        <div>Rehber verisi yükleniyor...</div>
      </div>
    </div>
  </main>

  <!-- Tam Ekran Yüzen Kontroller -->
  <div class="fs-floating-controls" id="fs-controls">
    <button class="btn-toolbar" id="fs-prev" style="padding: 0.3rem 0.6rem; color: #ffffff; background: rgba(255,255,255,0.15);">◀</button>
    <span id="fs-counter" style="font-size: 0.85rem; font-weight: 600;">1 / 1</span>
    <button class="btn-toolbar" id="fs-next" style="padding: 0.3rem 0.6rem; color: #ffffff; background: rgba(255,255,255,0.15);">▶</button>
    <button class="btn-toolbar" id="fs-close" style="padding: 0.3rem 0.6rem; color: #f87171; background: rgba(255,255,255,0.15);">✕ Çık</button>
  </div>

  <script>
    const CONFIG = {
      jsonPath: './ahrehberassets/data/guide.json',
      pagesDir: './ahrehberassets/pages/'
    };

    let items = [];
    let currentIndex = -1;
    let isFlipping = false;
    let isFullscreen = false;

    // ─── Mobil Pinch to Zoom & Pan Değişkenleri ───
    let zoomScale = 1;
    let zoomPosX = 0;
    let zoomPosY = 0;
    let initialPinchDist = 0;
    let initialPinchScale = 1;
    let isPinching = false;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let lastTapTime = 0;
    let touchStartX = 0;
    let touchStartY = 0;

    // DOM Elementleri
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const toggleMenuBtn = document.getElementById('toggle-menu-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const menuTree = document.getElementById('menu-tree');
    const bookStage = document.getElementById('book-stage');
    const bookWrapper = document.getElementById('book-wrapper');
    const guideImage = document.getElementById('guide-image');
    const flipOverlay = document.getElementById('flip-overlay');
    const flipLeaf = document.getElementById('flip-leaf');
    const flipImage = document.getElementById('flip-image');
    const flipLight = document.getElementById('flip-light');
    const baseShadow = document.getElementById('base-shadow');
    const canvasContainer = document.getElementById('canvas-container');
    const statusState = document.getElementById('status-state');
    const currentTitle = document.getElementById('current-title');
    const pageIndicator = document.getElementById('page-indicator');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const searchInput = document.getElementById('search');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeIconLight = document.getElementById('theme-icon-light');
    const themeIconDark = document.getElementById('theme-icon-dark');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fsPrev = document.getElementById('fs-prev');
    const fsNext = document.getElementById('fs-next');
    const fsClose = document.getElementById('fs-close');
    const fsCounter = document.getElementById('fs-counter');

    // Tema Yönetimi
    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-theme');
        if (themeIconLight) themeIconLight.style.display = 'block';
        if (themeIconDark) themeIconDark.style.display = 'none';
      } else {
        document.body.classList.remove('dark-theme');
        if (themeIconLight) themeIconLight.style.display = 'none';
        if (themeIconDark) themeIconDark.style.display = 'block';
      }
    }

    const savedTheme = localStorage.getItem('app-theme') || 'light';
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.body.classList.contains('dark-theme');
      const newTheme = isDark ? 'light' : 'dark';
      applyTheme(newTheme);
      localStorage.setItem('app-theme', newTheme);
    });

    // Menü Aç/Kapat
    function toggleDrawer(open) {
      if (open) {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('open');
      } else {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('open');
      }
    }

    toggleMenuBtn.addEventListener('click', () => toggleDrawer(true));
    closeSidebarBtn.addEventListener('click', () => toggleDrawer(false));
    sidebarOverlay.addEventListener('click', () => toggleDrawer(false));

    // ─── Zoom & Pan Fonksiyonları ───
    function applyZoomTransform(animate = false) {
      if (animate) {
        bookStage.style.transition = 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)';
      } else {
        bookStage.style.transition = 'none';
      }
      bookStage.style.transform = `translate3d(${zoomPosX}px, ${zoomPosY}px, 0) scale(${zoomScale})`;
    }

    function resetZoom(animate = true) {
      zoomScale = 1;
      zoomPosX = 0;
      zoomPosY = 0;
      applyZoomTransform(animate);
    }

    function getDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function clampPan() {
      if (zoomScale <= 1) {
        zoomPosX = 0;
        zoomPosY = 0;
        return;
      }
      const rect = bookWrapper.getBoundingClientRect();
      const containerRect = canvasContainer.getBoundingClientRect();
      
      const maxPanX = Math.max(0, (rect.width - containerRect.width) / 2 + 60);
      const maxPanY = Math.max(0, (rect.height - containerRect.height) / 2 + 60);

      zoomPosX = Math.max(-maxPanX, Math.min(maxPanX, zoomPosX));
      zoomPosY = Math.max(-maxPanY, Math.min(maxPanY, zoomPosY));
    }

    // Veri Yükleme
    async function init() {
      try {
        const res = await fetch(CONFIG.jsonPath);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        const data = await res.json();

        items = data.map((d, idx) => {
          const pageNum = d.page !== undefined ? d.page : idx + 1;
          const imgPath = d.image ? d.image.replace(/^.*[\\\/]/, '') : `page_${pageNum}.jpg`;
          return {
            page: pageNum,
            file: imgPath,
            text: d.text || ''
          };
        });

        renderMenu(items);

        if (items.length > 0) {
          selectItem(0, false);
        } else {
          statusState.textContent = 'JSON verisi boş.';
        }
      } catch (err) {
        console.error('Yükleme hatası:', err);
        statusState.innerHTML = `
          <strong style="color: #f87171;">Veri Yüklenemedi</strong><br><br>
          İstek: <code>${CONFIG.jsonPath}</code><br>
          Hata: ${err.message}
        `;
      }
    }

    function renderMenu(list) {
      menuTree.innerHTML = '';
      if (list.length === 0) {
        menuTree.innerHTML = '<div style="padding: 1rem; color: var(--text-muted); font-size: 0.85rem;">Eşleşen sonuç bulunamadı.</div>';
        return;
      }

      list.forEach((item) => {
        const el = document.createElement('div');
        const originalIndex = items.findIndex(i => i.page === item.page);
        
        el.className = `menu-item ${originalIndex === currentIndex ? 'active' : ''}`;
        const previewText = item.text ? item.text.substring(0, 55) + '...' : 'Görsel Sayfa';
        
        el.innerHTML = `
          <div class="menu-header">
            <span>Sayfa ${item.page}</span>
            <span class="page-badge">#${item.page}</span>
          </div>
          <div class="menu-snippet">${previewText}</div>
        `;
        
        el.addEventListener('click', () => {
          selectItem(originalIndex, originalIndex > currentIndex ? 'next' : 'prev');
          if (window.innerWidth <= 768) {
            toggleDrawer(false);
          }
        });
        menuTree.appendChild(el);
      });
    }

    // Gerçekçi 3D Kitap Sayfa Çevirme Animasyonlu Seçim
    function selectItem(index, direction = false) {
      if (index < 0 || index >= items.length) return;
      if (isFlipping && direction) return;

      resetZoom(false);

      const oldIndex = currentIndex;
      currentIndex = index;
      const target = items[index];

      currentTitle.textContent = `Sayfa ${target.page}`;
      pageIndicator.textContent = `${index + 1} / ${items.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === items.length - 1;

      if (isFullscreen) {
        fsCounter.textContent = `${index + 1} / ${items.length}`;
        fsPrev.disabled = index === 0;
        fsNext.disabled = index === items.length - 1;
      }

      // Sidebar aktiflik senkronu
      document.querySelectorAll('.menu-item').forEach(el => {
        el.classList.toggle('active', el.textContent.includes(`Sayfa ${target.page}`));
      });

      const fullImgPath = `${CONFIG.pagesDir}${target.file}`;

      if (direction && oldIndex !== -1 && oldIndex !== index) {
        isFlipping = true;
        const oldTarget = items[oldIndex];
        const oldImgPath = `${CONFIG.pagesDir}${oldTarget.file}`;

        if (direction === 'next') {
          flipImage.src = oldImgPath;
          flipLeaf.className = 'flip-leaf turn-next-anim';
          flipLight.style.background = 'linear-gradient(to right, rgba(0,0,0,0.15) 0%, rgba(255,255,255,0.2) 50%, rgba(0,0,0,0.4) 100%)';
          flipOverlay.classList.add('active');
          baseShadow.style.opacity = '1';

          guideImage.src = fullImgPath;

          setTimeout(() => {
            baseShadow.style.opacity = '0';
          }, 250);

          setTimeout(() => {
            flipOverlay.classList.remove('active');
            flipLeaf.className = 'flip-leaf';
            isFlipping = false;
          }, 460);
        } else {
          flipImage.src = fullImgPath;
          flipLeaf.className = 'flip-leaf turn-prev-anim';
          flipLight.style.background = 'linear-gradient(to left, rgba(0,0,0,0.15) 0%, rgba(255,255,255,0.2) 50%, rgba(0,0,0,0.4) 100%)';
          flipOverlay.classList.add('active');

          guideImage.src = fullImgPath;

          setTimeout(() => {
            flipOverlay.classList.remove('active');
            flipLeaf.className = 'flip-leaf';
            isFlipping = false;
          }, 460);
        }
      } else {
        guideImage.src = fullImgPath;
      }

      statusState.style.display = 'none';
      bookWrapper.style.display = 'inline-block';

      // Komşu sayfaları önceden belleğe al (Preload)
      if (index + 1 < items.length) {
        const nextImg = new Image();
        nextImg.src = `${CONFIG.pagesDir}${items[index + 1].file}`;
      }
      if (index - 1 >= 0) {
        const prevImg = new Image();
        prevImg.src = `${CONFIG.pagesDir}${items[index - 1].file}`;
      }

      guideImage.onerror = () => {
        bookWrapper.style.display = 'none';
        statusState.style.display = 'block';
        statusState.innerHTML = `<strong style="color: #f87171;">Görsel Bulunamadı:</strong><br><code style="font-size: 0.8rem;">${fullImgPath}</code>`;
      };
    }

    // Gezinme Butonları
    prevBtn.addEventListener('click', () => selectItem(currentIndex - 1, 'prev'));
    nextBtn.addEventListener('click', () => selectItem(currentIndex + 1, 'next'));
    fsPrev.addEventListener('click', () => selectItem(currentIndex - 1, 'prev'));
    fsNext.addEventListener('click', () => selectItem(currentIndex + 1, 'next'));

    // Arama Filtresi
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderMenu(items);
        return;
      }
      const filtered = items.filter(i => 
        i.page.toString().includes(term) || 
        i.text.toLowerCase().includes(term)
      );
      renderMenu(filtered);
    });

    // Tam Ekran Fonksiyonu
    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      document.body.classList.toggle('fs-mode', isFullscreen);
      if (isFullscreen) {
        fsCounter.textContent = `${currentIndex + 1} / ${items.length}`;
        fsPrev.disabled = currentIndex === 0;
        fsNext.disabled = currentIndex === items.length - 1;
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fsClose.addEventListener('click', toggleFullscreen);

    // Klavye Kısayolları
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); selectItem(currentIndex - 1, 'prev'); }
      if (e.key === 'ArrowRight') { e.preventDefault(); selectItem(currentIndex + 1, 'next'); }
      if (e.key === 'Escape') {
        if (isFullscreen) toggleFullscreen();
        else toggleDrawer(false);
      }
      if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    // ─── Mobil Pinch to Zoom, Pan & Swipe Event Dinleyicileri ───
    canvasContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        // İki parmak: Pinch-to-zoom başlat
        isPinching = true;
        isPanning = false;
        initialPinchDist = getDistance(e.touches[0], e.touches[1]);
        initialPinchScale = zoomScale;
      } else if (e.touches.length === 1) {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        if (zoomScale > 1.05) {
          isPanning = true;
          panStartX = touch.clientX - zoomPosX;
          panStartY = touch.clientY - zoomPosY;
        } else {
          isPanning = false;
        }

        // Çift Dokunma (Double Tap) ile Yakınlaştırma
        const now = Date.now();
        if (now - lastTapTime < 300) {
          if (zoomScale > 1.2) {
            resetZoom(true);
          } else {
            zoomScale = 2.5;
            const containerRect = canvasContainer.getBoundingClientRect();
            const tapX = touch.clientX - containerRect.left - containerRect.width / 2;
            const tapY = touch.clientY - containerRect.top - containerRect.height / 2;
            zoomPosX = -tapX * 1.2;
            zoomPosY = -tapY * 1.2;
            clampPan();
            applyZoomTransform(true);
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
      }
    }, { passive: false });

    canvasContainer.addEventListener('touchmove', (e) => {
      if (isPinching && e.touches.length === 2) {
        e.preventDefault();
        const dist = getDistance(e.touches[0], e.touches[1]);
        if (initialPinchDist > 0) {
          const rawScale = initialPinchScale * (dist / initialPinchDist);
          zoomScale = Math.min(Math.max(rawScale, 1), 4.5);
          clampPan();
          applyZoomTransform(false);
        }
      } else if (isPanning && e.touches.length === 1 && zoomScale > 1.05) {
        e.preventDefault();
        const touch = e.touches[0];
        zoomPosX = touch.clientX - panStartX;
        zoomPosY = touch.clientY - panStartY;
        clampPan();
        applyZoomTransform(false);
      }
    }, { passive: false });

    canvasContainer.addEventListener('touchend', (e) => {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
        if (zoomScale < 1.05) {
          resetZoom(true);
        } else {
          clampPan();
          applyZoomTransform(true);
        }
      } else if (e.touches.length === 0) {
        if (isPanning) {
          isPanning = false;
          clampPan();
          applyZoomTransform(true);
        } else if (zoomScale <= 1.05) {
          // Sayfa Çevirme (Swipe)
          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;
          const diffX = touchEndX - touchStartX;
          const diffY = touchEndY - touchStartY;

          if (Math.abs(diffX) > Math.abs(diffY) * 1.4 && Math.abs(diffX) > 45) {
            if (diffX < 0) {
              selectItem(currentIndex + 1, 'next');
            } else {
              selectItem(currentIndex - 1, 'prev');
            }
          }
        }
      }
    }, { passive: true });

    // Masaüstü Touchpad / Mouse Wheel Zoom
    canvasContainer.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const zoomDelta = e.deltaY * -0.01;
        const newScale = Math.min(Math.max(zoomScale + zoomDelta, 1), 4.5);
        if (newScale !== zoomScale) {
          zoomScale = newScale;
          if (zoomScale <= 1.02) {
            resetZoom(true);
          } else {
            clampPan();
            applyZoomTransform(false);
          }
        }
      }
    }, { passive: false });

    init();
  </script>
</body>
</html>
