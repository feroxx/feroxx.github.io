<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Birinci Basamak Tanı ve Tedavi Rehberi 2026</title>
  <meta name="description" content="T.C. Sağlık Bakanlığı — Birinci Basamağa Yönelik Tanı ve Tedavi Rehberleri 2026">
  
  <style>
    :root {
      /* Varsayılan Açık Tema */
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: #ffffff;
      --bg-active: #0284c7;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent-semptom: #d97706;
      --accent-hastalik: #0284c7;
      --accent-koruyucu: #059669;
      --canvas-bg: radial-gradient(circle at center, #e2e8f0 0%, #cbd5e1 100%);
      --book-bg: #ffffff;
      --book-shadow: 0 16px 36px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.06);
      --spine-shadow: linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.03) 60%, transparent 100%);
      --item-bg: rgba(0, 0, 0, 0.02);
      --item-hover: rgba(0, 0, 0, 0.05);
      --badge-bg: rgba(0, 0, 0, 0.08);
      --badge-color: #334155;
      --header-height: 56px;
      --sidebar-width: 330px;
      --radius: 8px;
    }

    body.dark-theme {
      /* Koyu Tema */
      --bg-main: #0b1120;
      --bg-panel: #131d31;
      --bg-card: #1e293b;
      --bg-active: #0284c7;
      --border-color: #24344d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent-semptom: #f59e0b;
      --accent-hastalik: #38bdf8;
      --accent-koruyucu: #10b981;
      --canvas-bg: radial-gradient(circle at center, #111a2e 0%, #080c16 100%);
      --book-bg: #1e293b;
      --book-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      --spine-shadow: linear-gradient(to right, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.08) 60%, transparent 100%);
      --item-bg: rgba(255, 255, 255, 0.02);
      --item-hover: rgba(255, 255, 255, 0.06);
      --badge-bg: rgba(0, 0, 0, 0.35);
      --badge-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Sol Menü / Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 50;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar-header {
      padding: 0.85rem 1rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      background: var(--bg-panel);
    }

    .sidebar-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
      border-radius: 4px;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .search-box-wrapper {
      position: relative;
      width: 100%;
    }

    #search-input {
      width: 100%;
      padding: 0.6rem 0.75rem 0.6rem 2.2rem;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .search-icon-svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    #search-clear {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      font-size: 0.9rem;
    }

    #search-clear.visible {
      display: block;
    }

    /* Kategori Filtre Butonları */
    .cat-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--bg-main);
      padding: 3px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .cat-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 2px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .cat-tab:hover {
      color: var(--text-main);
    }

    .cat-tab.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .sidebar-count-bar {
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.03);
    }

    #sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar-item {
      padding: 0.65rem 0.75rem;
      margin-bottom: 4px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      background: var(--item-bg);
      border: 1px solid transparent;
    }

    .sidebar-item:hover {
      background: var(--item-hover);
      color: var(--text-main);
    }

    .sidebar-item.active {
      background: var(--bg-active);
      color: #ffffff !important;
      font-weight: 600;
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    .item-num {
      font-size: 0.72rem;
      padding: 2px 6px;
      background: var(--badge-bg);
      border-radius: 4px;
      font-weight: 700;
      color: var(--badge-color);
      flex-shrink: 0;
    }

    .sidebar-item.active .item-num {
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
    }

    .item-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Arama Sonuç Dropdown */
    #search-results {
      display: none;
      position: absolute;
      left: 1rem;
      right: 1rem;
      top: 105px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 12px 36px rgba(0,0,0,0.3);
      max-height: 400px;
      overflow-y: auto;
      z-index: 100;
      padding: 0.5rem;
    }

    #search-results.open {
      display: block;
    }

    .result-item {
      padding: 0.65rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      background: var(--item-bg);
      border: 1px solid transparent;
      transition: all 0.12s;
    }

    .result-item:hover {
      background: var(--item-hover);
      border-color: var(--primary);
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .result-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .result-badge.semptomlar { background: rgba(245, 158, 11, 0.15); color: var(--accent-semptom); }
    .result-badge.hastaliklar { background: rgba(2, 132, 199, 0.15); color: var(--accent-hastalik); }
    .result-badge.koruyucu   { background: rgba(16, 185, 129, 0.15); color: var(--accent-koruyucu); }

    .result-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .result-preview {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 2px;
    }

    /* Mobil Çekmece Karartması */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #sidebar-overlay.open {
      display: block;
      opacity: 1;
    }

    /* Sağ Ana İçerik / Viewer */
    #viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-main);
    }

    /* Üst Araç Çubuğu (Toolbar) */
    .toolbar {
      height: var(--header-height);
      padding: 0 1rem;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 0.75rem;
      z-index: 10;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .btn-toolbar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      min-height: 36px;
    }

    .btn-toolbar:hover:not(:disabled) {
      background: var(--item-hover);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-toolbar:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-toolbar:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #toggle-menu-btn {
      display: none;
    }

    .doc-title-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #current-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-pill {
      font-size: 0.72rem;
      padding: 2px 8px;
      background: rgba(2, 132, 199, 0.12);
      color: var(--primary);
      border-radius: 9999px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .page-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #page-indicator {
      font-size: 0.875rem;
      padding: 0 0.5rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ─── Gerçekçi 3D Kitap Sahnesi & Sayfa Çevirme Motoru ─── */
    .canvas-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.25rem;
      background: var(--canvas-bg);
      perspective: 2400px;
      touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch;
      position: relative;
      transition: background 0.2s ease;
    }

    .book-stage {
      position: relative;
      max-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
    }

    .book-wrapper {
      position: relative;
      border-radius: 6px;
      box-shadow: var(--book-shadow);
      background-color: var(--book-bg);
      perspective: 2000px;
      transform-style: preserve-3d;
      user-select: none;
      display: inline-block;
      max-width: 100%;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Sol Cilt Dikiş & Gölgelendirme Derinliği */
    .book-spine-shadow {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 28px;
      background: var(--spine-shadow);
      z-index: 25;
      pointer-events: none;
    }

    .page-image {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - var(--header-height) - 3rem);
      height: auto;
      width: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 4px;
    }

    /* Alt Sayfa Gölge Katmanı */
    .base-page-shadow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.45s ease;
      background: linear-gradient(to right, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.05) 50%, transparent 100%);
    }

    /* Dönen 3D Yaprak (Flip Leaf) */
    .flip-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 20;
      display: none;
    }

    .flip-overlay.active {
      display: block;
    }

    .flip-leaf {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      overflow: hidden;
      border-radius: 4px;
    }

    .flip-leaf img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      backface-visibility: hidden;
    }

    .flip-lighting-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Gerçekçi İleri Sayfa Çevirme Animasyonu */
    .turn-next-anim {
      animation: realisticFlipNext 0.46s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    }

    @keyframes realisticFlipNext {
      0% {
        transform: rotateY(0deg);
        filter: brightness(1);
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
      35% {
        transform: rotateY(-55deg) scaleY(0.98);
        filter: brightness(0.94);
        box-shadow: -15px 5px 25px rgba(0,0,0,0.25);
      }
      70% {
        transform: rotateY(-125deg) scaleY(0.97);
        filter: brightness(0.86);
        box-shadow: -25px 10px 35px rgba(0,0,0,0.32);
      }
      100% {
        transform: rotateY(-180deg) scaleY(0.96);
        filter: brightness(0.8);
        opacity: 0;
        box-shadow: -35px 15px 45px rgba(0,0,0,0.4);
      }
    }

    /* Gerçekçi Geri Sayfa Çevirme Animasyonu */
    .turn-prev-anim {
      animation: realisticFlipPrev 0.46s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    }

    @keyframes realisticFlipPrev {
      0% {
        transform: rotateY(-180deg) scaleY(0.96);
        filter: brightness(0.8);
        opacity: 0;
        box-shadow: -35px 15px 45px rgba(0,0,0,0.4);
      }
      35% {
        transform: rotateY(-125deg) scaleY(0.97);
        filter: brightness(0.86);
        opacity: 1;
        box-shadow: -25px 10px 35px rgba(0,0,0,0.32);
      }
      70% {
        transform: rotateY(-55deg) scaleY(0.98);
        filter: brightness(0.94);
        box-shadow: -15px 5px 25px rgba(0,0,0,0.25);
      }
      100% {
        transform: rotateY(0deg) scaleY(1);
        filter: brightness(1);
        opacity: 1;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
    }

    /* Durum ve Yükleme Bildirimi */
    .status-state {
      margin: auto;
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Fullscreen Modu */
    body.fs-mode .toolbar {
      display: none;
    }

    body.fs-mode #sidebar {
      display: none;
    }

    body.fs-mode .canvas-container {
      padding: 0;
      background: #000000;
    }

    body.fs-mode .book-wrapper {
      border-radius: 0;
      box-shadow: none;
    }

    body.fs-mode .page-image {
      max-height: 100vh;
      max-width: 100vw;
    }

    .fs-floating-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      align-items: center;
      gap: 12px;
      z-index: 100;
      color: #ffffff;
    }

    body.fs-mode .fs-floating-controls {
      display: flex;
    }

    /* Mobil Duyarlılık (< 768px) */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 85%;
        max-width: 320px;
        transform: translateX(-100%);
        box-shadow: 6px 0 24px rgba(0, 0, 0, 0.4);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      .close-btn {
        display: block;
      }

      #toggle-menu-btn {
        display: inline-flex;
      }

      .category-pill {
        display: none;
      }

      .canvas-container {
        padding: 0.5rem;
      }

      .book-wrapper {
        border-radius: 4px;
      }

      .btn-toolbar {
        padding: 0.4rem 0.55rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Mobil Menü Karartması -->
  <div id="sidebar-overlay"></div>

  <!-- Sol Menü Çekmecesi -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-top">
        <h1>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          Rehber İndeksi 2026
        </h1>
        <button id="close-sidebar-btn" class="close-btn" aria-label="Menüyü Kapat">&times;</button>
      </div>

      <div class="search-box-wrapper">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="search-input" placeholder="Hastalık, semptom ara..." autocomplete="off" />
        <button id="search-clear">✕</button>
      </div>

      <div class="cat-tabs" id="cat-tabs">
        <button class="cat-tab active" data-cat="all">Tümü</button>
        <button class="cat-tab" data-cat="semptomlar">Semptom</button>
        <button class="cat-tab" data-cat="hastaliklar">Hastalık</button>
        <button class="cat-tab" data-cat="koruyucu">Koruyucu</button>
      </div>
    </div>

    <div class="sidebar-count-bar">
      <span id="sidebar-count">Yükleniyor...</span>
      <span style="font-size: 0.7rem; opacity: 0.7;">T.C. Sağlık Bakanlığı</span>
    </div>

    <div id="sidebar-list"></div>

    <!-- Anlık Arama Sonuç Paneli -->
    <div id="search-results"></div>
  </aside>

  <!-- Sağ Sayfa Alanı (Viewer) -->
  <main id="viewer">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="toggle-menu-btn" class="btn-toolbar" aria-label="Menüyü Aç">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          Fihrist
        </button>
        <div class="doc-title-badge">
          <span id="current-title">Yükleniyor...</span>
          <span class="category-pill" id="viewer-badge">TTR 2026</span>
        </div>
      </div>

      <div class="page-controls">
        <button id="prev-btn" class="btn-toolbar" title="Önceki Sayfa (Sol Ok)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <span id="page-indicator">- / -</span>

        <button id="next-btn" class="btn-toolbar" title="Sonraki Sayfa (Sağ Ok)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <!-- Tema Değiştirme Butonu (Koyu / Açık) -->
        <button id="theme-toggle-btn" class="btn-toolbar" title="Temayı Değiştir (Açık/Koyu)">
          <svg id="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="theme-icon-light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- Tam Ekran Butonu -->
        <button id="fullscreen-btn" class="btn-toolbar" title="Tam Ekran (F)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="canvas-container" id="canvas-container">
      <div class="book-stage" id="book-stage">
        <!-- Kitap Görüntüleyici -->
        <div class="book-wrapper" id="book-wrapper" style="display: none;">
          <img id="page-img" class="page-image" alt="Rehber Sayfası" />
          <div class="book-spine-shadow"></div>
          <div class="base-page-shadow" id="base-shadow"></div>

          <div class="flip-overlay" id="flip-overlay">
            <div class="flip-leaf" id="flip-leaf">
              <img id="flip-image" alt="" />
              <div class="flip-lighting-overlay" id="flip-light"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="status-state" class="status-state">
        <div class="loading-spinner"></div>
        <div>Rehber verisi yükleniyor...</div>
      </div>
    </div>
  </main>

  <!-- Tam Ekran Yüzen Kontroller -->
  <div class="fs-floating-controls" id="fs-controls">
    <button class="btn-toolbar" id="fs-prev" style="padding: 0.3rem 0.6rem; color: #ffffff; background: rgba(255,255,255,0.15);">◀</button>
    <span id="fs-counter" style="font-size: 0.85rem; font-weight: 600;">1 / 1</span>
    <button class="btn-toolbar" id="fs-next" style="padding: 0.3rem 0.6rem; color: #ffffff; background: rgba(255,255,255,0.15);">▶</button>
    <button class="btn-toolbar" id="fs-close" style="padding: 0.3rem 0.6rem; color: #f87171; background: rgba(255,255,255,0.15);">✕ Çık</button>
  </div>

  <script>
    let INDEX = [];
    let activeCat = 'all';
    let activeId = null;
    let currentPage = 1;
    let totalPages = 1;
    let isFlipping = false;
    let isFullscreen = false;
    let searchDebounce = null;

    // DOM Elementleri
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const toggleMenuBtn = document.getElementById('toggle-menu-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const sidebarList = document.getElementById('sidebar-list');
    const sidebarCount = document.getElementById('sidebar-count');
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    const searchResults = document.getElementById('search-results');
    const bookWrapper = document.getElementById('book-wrapper');
    const pageImg = document.getElementById('page-img');
    const flipOverlay = document.getElementById('flip-overlay');
    const flipLeaf = document.getElementById('flip-leaf');
    const flipImage = document.getElementById('flip-image');
    const flipLight = document.getElementById('flip-light');
    const baseShadow = document.getElementById('base-shadow');
    const canvasContainer = document.getElementById('canvas-container');
    const statusState = document.getElementById('status-state');
    const currentTitle = document.getElementById('current-title');
    const viewerBadge = document.getElementById('viewer-badge');
    const pageIndicator = document.getElementById('page-indicator');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeIconLight = document.getElementById('theme-icon-light');
    const themeIconDark = document.getElementById('theme-icon-dark');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fsPrev = document.getElementById('fs-prev');
    const fsNext = document.getElementById('fs-next');
    const fsClose = document.getElementById('fs-close');
    const fsCounter = document.getElementById('fs-counter');

    // Tema Yönetimi (Varsayılan Açık Tema)
    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-theme');
        if (themeIconLight) themeIconLight.style.display = 'block';
        if (themeIconDark) themeIconDark.style.display = 'none';
      } else {
        document.body.classList.remove('dark-theme');
        if (themeIconLight) themeIconLight.style.display = 'none';
        if (themeIconDark) themeIconDark.style.display = 'block';
      }
    }

    const savedTheme = localStorage.getItem('app-theme') || 'light';
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.body.classList.contains('dark-theme');
      const newTheme = isDark ? 'light' : 'dark';
      applyTheme(newTheme);
      localStorage.setItem('app-theme', newTheme);
    });

    function toggleDrawer(open) {
      if (open) {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('open');
      } else {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('open');
      }
    }

    toggleMenuBtn.addEventListener('click', () => toggleDrawer(true));
    closeSidebarBtn.addEventListener('click', () => toggleDrawer(false));
    sidebarOverlay.addEventListener('click', () => toggleDrawer(false));

    async function init() {
      const possibleIndexPaths = ['./data/search_index.json', 'data/search_index.json'];
      let loaded = false;

      for (const path of possibleIndexPaths) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            INDEX = await res.json();
            loaded = true;
            break;
          }
        } catch(e) {}
      }

      if (!loaded || !INDEX.length) {
        statusState.innerHTML = '<strong style="color: #f87171;">Rehber arama verisi yüklenemedi.</strong>';
        return;
      }

      renderSidebar();
      setupCatTabs();
      setupSearch();

      let targetId = INDEX[0].id;
      if (location.hash) {
        const hashId = decodeURIComponent(location.hash.slice(1));
        if (INDEX.some(s => s.id === hashId)) {
          targetId = hashId;
        }
      }

      loadSection(targetId);
    }

    function renderSidebar(filter) {
      let items = INDEX;
      if (activeCat !== 'all') items = items.filter(s => s.category === activeCat);
      if (filter) {
        const q = filter.toLowerCase();
        items = items.filter(s => s.title.toLowerCase().includes(q) || s.num.includes(q));
      }
      sidebarCount.textContent = `${items.length} bölüm listelendi`;
      
      sidebarList.innerHTML = items.map(s => `
        <div class="sidebar-item ${s.id === activeId ? 'active' : ''}" data-id="${s.id}" onclick="loadSection('${s.id}')">
          <span class="item-num">${s.num}</span>
          <span class="item-title">${s.title}</span>
        </div>
      `).join('');
    }

    function setupCatTabs() {
      document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCat = btn.dataset.cat;
          document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderSidebar(searchInput.value.trim());
        });
      });
    }

    async function loadSection(id) {
      activeId = id;
      currentPage = 1;

      document.querySelectorAll('.sidebar-item').forEach(el =>
        el.classList.toggle('active', el.dataset.id === id));
      
      const activeEl = document.querySelector(`.sidebar-item[data-id="${id}"]`);
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

      let manifest = { count: 1, title: '' };
      const possibleManifests = [`./data/pages/${id}/manifest.json`, `data/pages/${id}/manifest.json`];
      
      for (const mPath of possibleManifests) {
        try {
          const res = await fetch(mPath);
          if (res.ok) {
            manifest = await res.json();
            break;
          }
        } catch(e) {}
      }
      totalPages = manifest.count || 1;

      const info = INDEX.find(s => s.id === id) || {};
      const catLabel = { semptomlar:'Semptom', hastaliklar:'Hastalık', koruyucu:'Koruyucu' }[info.category] || 'TTR 2026';

      viewerBadge.textContent = catLabel;
      currentTitle.textContent = `${info.num ? info.num + ' ' : ''}${info.title || id}`;

      statusState.style.display = 'none';
      bookWrapper.style.display = 'inline-block';

      showPage(1, false);
      history.replaceState(null, '', `#${encodeURIComponent(id)}`);

      if (window.innerWidth <= 768) {
        toggleDrawer(false);
      }
    }

    // Gerçekçi 3D Kitap Sayfası Çevirme Animasyonu ile Sayfa Gösterimi
    function showPage(n, direction = false) {
      if (!activeId) return;
      if (isFlipping && direction) return;

      const targetPage = Math.max(1, Math.min(n, totalPages));
      const oldPage = currentPage;
      currentPage = targetPage;

      pageIndicator.textContent = `${currentPage} / ${totalPages}`;
      prevBtn.disabled = (currentPage <= 1);
      nextBtn.disabled = (currentPage >= totalPages);

      if (isFullscreen) {
        fsCounter.textContent = `${currentPage} / ${totalPages}`;
        fsPrev.disabled = (currentPage <= 1);
        fsNext.disabled = (currentPage >= totalPages);
      }

      const fullImgPath = `./data/pages/${activeId}/p${currentPage}.jpg`;

      if (direction && oldPage !== currentPage) {
        isFlipping = true;
        const oldImgPath = `./data/pages/${activeId}/p${oldPage}.jpg`;

        if (direction === 'next') {
          flipImage.src = oldImgPath;
          flipLeaf.className = 'flip-leaf turn-next-anim';
          flipLight.style.background = 'linear-gradient(to right, rgba(0,0,0,0.15) 0%, rgba(255,255,255,0.2) 50%, rgba(0,0,0,0.4) 100%)';
          flipOverlay.classList.add('active');
          baseShadow.style.opacity = '1';

          pageImg.src = fullImgPath;

          setTimeout(() => {
            baseShadow.style.opacity = '0';
          }, 250);

          setTimeout(() => {
            flipOverlay.classList.remove('active');
            flipLeaf.className = 'flip-leaf';
            isFlipping = false;
          }, 460);
        } else {
          flipImage.src = fullImgPath;
          flipLeaf.className = 'flip-leaf turn-prev-anim';
          flipLight.style.background = 'linear-gradient(to left, rgba(0,0,0,0.15) 0%, rgba(255,255,255,0.2) 50%, rgba(0,0,0,0.4) 100%)';
          flipOverlay.classList.add('active');

          pageImg.src = fullImgPath;

          setTimeout(() => {
            flipOverlay.classList.remove('active');
            flipLeaf.className = 'flip-leaf';
            isFlipping = false;
          }, 460);
        }
      } else {
        pageImg.src = fullImgPath;
      }

      canvasContainer.scrollTop = 0;

      // Önceden yükleme (Preload)
      if (currentPage + 1 <= totalPages) {
        const nextImg = new Image();
        nextImg.src = `./data/pages/${activeId}/p${currentPage + 1}.jpg`;
      }
      if (currentPage - 1 >= 1) {
        const prevImg = new Image();
        prevImg.src = `./data/pages/${activeId}/p${currentPage - 1}.jpg`;
      }
    }

    function changePage(delta) {
      const dir = delta > 0 ? 'next' : 'prev';
      showPage(currentPage + delta, dir);
    }

    prevBtn.addEventListener('click', () => changePage(-1));
    nextBtn.addEventListener('click', () => changePage(1));
    fsPrev.addEventListener('click', () => changePage(-1));
    fsNext.addEventListener('click', () => changePage(1));

    // Arama Fonksiyonları
    function setupSearch() {
      searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim();
        searchClear.classList.toggle('visible', q.length > 0);
        clearTimeout(searchDebounce);
        if (q.length < 2) {
          searchResults.classList.remove('open');
          renderSidebar('');
          return;
        }
        searchDebounce = setTimeout(() => doSearch(q), 120);
      });

      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchClear.classList.remove('visible');
        searchResults.classList.remove('open');
        renderSidebar('');
        searchInput.focus();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#sidebar')) {
          searchResults.classList.remove('open');
        }
      });
    }

    function doSearch(q) {
      const ql = q.toLowerCase();
      const hits = INDEX.filter(s =>
        s.title.toLowerCase().includes(ql) ||
        s.num.includes(q) ||
        (s.preview && s.preview.toLowerCase().includes(ql))
      ).slice(0, 15);

      if (!hits.length) {
        searchResults.innerHTML = '<div style="padding: 0.75rem; color: var(--text-muted); font-size: 0.85rem; text-align: center;">Eşleşen sonuç bulunamadı</div>';
        searchResults.classList.add('open');
        return;
      }

      const hl = (str, q) => str.replace(
        new RegExp(`(${q.replace(/[.*+?^${}()|[\]\]/g, '\$&')})`, 'gi'),
        '<mark style="background:rgba(2,132,199,0.25);color:var(--primary);padding:0 2px;border-radius:2px;font-weight:700">$1</mark>'
      );

      searchResults.innerHTML = hits.map(s => `
        <div class="result-item" onclick="selectSearchResult('${s.id}')">
          <div class="result-header">
            <span class="item-num">${s.num}</span>
            <span class="result-badge ${s.category}">${
              {semptomlar:'Semptom',hastaliklar:'Hastalık',koruyucu:'Koruyucu'}[s.category]||''
            }</span>
          </div>
          <div class="result-title">${hl(s.title, q)}</div>
          ${s.preview ? `<div class="result-preview">${hl(s.preview.slice(0,110), q)}…</div>` : ''}
        </div>
      `).join('');
      searchResults.classList.add('open');
    }

    window.selectSearchResult = function(id) {
      searchResults.classList.remove('open');
      searchInput.value = '';
      searchClear.classList.remove('visible');
      loadSection(id);
    };

    // Tam Ekran Fonksiyonu
    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      document.body.classList.toggle('fs-mode', isFullscreen);
      if (isFullscreen) {
        fsCounter.textContent = `${currentPage} / ${totalPages}`;
        fsPrev.disabled = (currentPage <= 1);
        fsNext.disabled = (currentPage >= totalPages);
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fsClose.addEventListener('click', toggleFullscreen);

    // Klavye Kısayolları
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); changePage(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); changePage(1); }
      if (e.key === 'Escape') {
        if (isFullscreen) toggleFullscreen();
        else toggleDrawer(false);
      }
      if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    // Mobil Dokunmatik Sağa/Sola Kaydırma (3D Page-Flip Swipe)
    let touchStartX = 0;
    let touchStartY = 0;

    canvasContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    canvasContainer.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
        if (diffX < 0) {
          changePage(1);
        } else {
          changePage(-1);
        }
      }
    }, { passive: true });

    init();
  </script>
</body>
</html>
