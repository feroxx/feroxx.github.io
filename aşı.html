<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHEF Çocukluk Çağı Aşı Takvimi Asistanı</title>
    <!-- Modern ikonlar için FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --warning-bg: #fef9c3;
            --warning-text: #854d0e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .dashboard-container {
            background-color: var(--surface);
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            padding: 2rem;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #bfdbfe;
            font-size: 0.95rem;
        }

        .form-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
        }

        select, input {
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            height: 48px; /* Inputlarla aynı hizaya gelmesi için */
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .results-section {
            padding: 2rem;
            background-color: #f8fafc;
        }

        .summary-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background-color: #e0e7ff;
            color: #3730a3;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        /* Modern Kart Tasarımı */
        .vaccine-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .vaccine-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--primary);
        }

        .vaccine-card.special-card::before {
            background-color: #f59e0b; /* Özel aşılar için turuncu */
        }

        .vaccine-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-icon {
            background-color: #eff6ff;
            color: var(--primary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .special-card .card-icon {
            background-color: #fef3c7;
            color: #d97706;
        }

        .card-content h3 {
            font-size: 1.125rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .card-content p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto 1.5rem auto;
            line-height: 1.5;
        }

        .next-appointment {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 1rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>Çocukluk Çağı Aşı Asistanı</h1>
        <p>Ulusal aşı takvimi ve özel aşı algoritmaları</p>
    </div>
    
    <div class="form-section">
        <div class="input-group">
            <label for="gender">Cinsiyet</label>
            <select id="gender">
                <option value="kiz">Kız</option>
                <option value="erkek">Erkek </option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="ageType">Zaman Kriteri</label>
            <select id="ageType">
                <option value="ay">Ay Olarak</option>
                <option value="yas">Yaş Olarak</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="ageValue">Değer Giriniz</label>
            <input type="number" id="ageValue" min="0" value="0" placeholder="Örn: 2">
        </div>
        
        <button class="btn-primary" onclick="calculateVaccines()">
            <i class="fa-solid fa-stethoscope"></i>
            Sorgula
        </button>
    </div>

    <div class="results-section" id="resultsContainer">
        <!-- JS ile dinamik render edilecek -->
    </div>
</div>

<script>
    const vaccineData = [
        { month: 0, name: "Hep-B (1. Doz)", desc: "Doğumda uygulanır.", isSpecial: false },
        { month: 2, name: "Hep-B (2. Doz), BCG, KPA (1. Doz), DaBT-İPA-Hib-HepB (1. Doz)", desc: "2. Ay sonu rutin aşıları.", isSpecial: false },
        { month: 4, name: "KPA (2. Doz), DaBT-İPA-Hib-HepB (2. Doz)", desc: "4. Ay sonu rutin aşıları.", isSpecial: false },
        { month: 6, name: "DaBT-İPA-Hib-HepB (3. Doz), OPA (1. Doz)", desc: "6. Ay sonu rutin aşıları.", isSpecial: false },
        { month: 6, name: "Meningokok (6. Ay Senaryosu)", desc: "Daha önce aşılanmadıysa konjuge veya rekombinant aşı planlaması başlatılır.", isSpecial: true },
        { month: 9, name: "KKK (Ek Doz)", desc: "9. Ay sonu Kızamık, Kızamıkçık, Kabakulak ek dozu.", isSpecial: false },
        { month: 12, name: "KPA (Rapel), Suçiçeği, KKK (1. Doz)", desc: "12. Ay (1 Yaş) rutin aşıları.", isSpecial: false },
        { month: 12, name: "Meningokok (12. Ay Senaryosu)", desc: "12 aylık veya büyük ve aşılanmadıysa Nimenrix, Menveo, Menactra veya Bexsero planlanabilir.", isSpecial: true },
        { month: 18, name: "DaBT-İPA-Hib-HepB (Rapel), OPA (2. Doz), Hep-A (1. Doz)", desc: "18. Ay sonu rutin aşıları.", isSpecial: false },
        { month: 24, name: "Hep-A (2. Doz)", desc: "24. Ay (2 Yaş) rutin aşıları.", isSpecial: false },
        { month: 24, name: "Meningokok (24. Ay Senaryosu)", desc: "24 aylık veya büyükse hekim kontrolünde aşılama başlatılabilir.", isSpecial: true },
        { month: 48, name: "DaBT-İPA (Rapel), KKK (2. Doz)", desc: "48. Ay (4 Yaş) rutin aşıları.", isSpecial: false },
        { month: 156, name: "Td (Rapel)", desc: "13 Yaş pekiştirme dozu.", isSpecial: false }
    ];

    const getRangeVaccines = (monthAge) => {
        const ranges = [];
        
        if (monthAge >= 1 && monthAge <= 7) {
            ranges.push({ 
                name: "Rotavirüs Aşı Periyodu", 
                desc: "1. ay ile 7. ay arasındaki bu dönemde Monovalan veya Pentavalan Rotavirüs aşılaması bulunabilir (Son doz en geç 7. ayda tamamlanmalıdır).",
                isSpecial: true,
                icon: "fa-shield-virus"
            });
        }
        
        if (monthAge >= 108 && monthAge <= 168) {
            ranges.push({ 
                name: "HPV Aşıları (9-14 Yaş)", 
                desc: "6-12 ay arayla 2 DOZ şeklinde uygulanır.",
                isSpecial: true,
                icon: "fa-vial"
            });
        }
        
        if (monthAge >= 180) {
            ranges.push({ 
                name: "HPV Aşıları (15+ Yaş)", 
                desc: "15 yaş ve sonrası başlayanlar için 6 ay boyunca 3 DOZ gereklidir.",
                isSpecial: true,
                icon: "fa-vial"
            });
        }
        return ranges;
    };

    const calculateVaccines = () => {
        const ageType = document.getElementById('ageType').value;
        const ageValue = parseInt(document.getElementById('ageValue').value) || 0;
        const gender = document.getElementById('gender').value;
        
        const totalMonths = ageType === 'yas' ? ageValue * 12 : ageValue;
        
        const exactMatches = vaccineData.filter(v => v.month === totalMonths);
        const rangeMatches = getRangeVaccines(totalMonths);
        
        const allMatches = [...exactMatches, ...rangeMatches];
        renderResults(allMatches, totalMonths, gender);
    };

    const renderResults = (vaccines, totalMonths, gender) => {
        const container = document.getElementById('resultsContainer');
        container.innerHTML = ''; 

        if (vaccines.length === 0) {
            const nextVaccine = vaccineData.find(v => v.month > totalMonths);
            let nextDisplay = '';
            
            if (nextVaccine) {
                nextDisplay = nextVaccine.month >= 12 && nextVaccine.month % 12 === 0 
                    ? `${nextVaccine.month / 12} Yaşı` 
                    : `${nextVaccine.month}. Ayı`;
            }

            container.innerHTML = `
                <div class="empty-state">
                    <i class="fa-regular fa-calendar-xmark"></i>
                    <h3>Rutin Aşı Bulunmuyor</h3>
                    <p>Girilen periyot için ulusal takvimde tanımlı rutin bir aşı noktası saptanmadı. Ulusal takvim özel aylarda uygulanır.</p>
                    ${nextVaccine ? `<div class="next-appointment"><i class="fa-solid fa-clock-rotate-left"></i> Sonraki rutin aşılama randevusu: <strong>${nextDisplay}</strong></div>` : ''}
                </div>
            `;
            return;
        }

        const displayUnit = totalMonths >= 12 && totalMonths % 12 === 0 ? `${totalMonths/12} Yaş` : `${totalMonths} Aylık`;
        const genderText = gender === 'kiz' ? 'Kız' : 'Erkek';
        
        container.innerHTML = `
            <div class="summary-badge">
                <i class="fa-solid fa-clipboard-user"></i>
                ${displayUnit} ${genderText} için Aşı Planı
            </div>
        `;

        vaccines.forEach(vaccine => {
            const cardClass = vaccine.isSpecial ? "vaccine-card special-card" : "vaccine-card";
            const iconClass = vaccine.icon ? vaccine.icon : "fa-syringe";
            
            const card = document.createElement('div');
            card.className = cardClass;
            
            card.innerHTML = `
                <div class="card-icon">
                    <i class="fa-solid ${iconClass}"></i>
                </div>
                <div class="card-content">
                    <h3>${vaccine.name}</h3>
                    <p>${vaccine.desc}</p>
                </div>
            `;
            container.appendChild(card);
        });
    };

    // DOM yüklendiğinde çalıştır
    document.addEventListener("DOMContentLoaded", calculateVaccines);
</script>
</body>
</html>
