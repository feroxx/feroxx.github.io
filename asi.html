<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHEF Çocukluk Çağı Aşı Asistanı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --special-bg: #fffbeb;
            --special-border: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .dashboard-container {
            background-color: var(--surface);
            width: 100%;
            max-width: 1000px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            padding: 2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .header img {
            height: 70px;
            background: white;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-text { text-align: left; }
        .header h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.3rem; }
        .header p { color: #bfdbfe; font-size: 0.95rem; }

        .form-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            align-items: end;
        }

        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .input-group label { font-size: 0.875rem; font-weight: 600; color: var(--text-main); }

        select, input[type="number"], input[type="date"] {
            padding: 0.875rem 1rem; border: 1px solid var(--border);
            border-radius: 8px; font-size: 1rem; font-family: 'Inter', sans-serif;
            background-color: #f8fafc; width: 100%;
        }

        select:focus, input:focus {
            outline: none; border-color: var(--primary); background-color: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .toggle-wrapper { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin-top: 0.5rem; background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }
        .toggle-label { font-weight: 600; font-size: 0.95rem; cursor: pointer; }

        .btn-primary, .btn-secondary, .btn-pdf {
            border: none; padding: 0.875rem 1.5rem; border-radius: 8px;
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; height: 48px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #e2e8f0; color: var(--text-main); }
        .btn-secondary:hover { background-color: #cbd5e1; }
        
        .btn-pdf { background-color: #ef4444; color: white; width: auto; font-size: 0.9rem; height: 40px; padding: 0 1.5rem; }
        .btn-pdf:hover { background-color: #dc2626; }

        .results-section { padding: 2rem; background-color: #f8fafc; }
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }

        .summary-badge {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
            border-radius: 9999px; background-color: #e0e7ff; color: #3730a3; font-weight: 600; font-size: 0.875rem;
        }

        .vaccine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

        .vaccine-card {
            background: white; border: 1px solid var(--border); border-radius: 12px;
            padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; transition: transform 0.2s, box-shadow 0.2s;
            border-left: 5px solid var(--primary);
            page-break-inside: avoid;
        }

        /* Geçmişte Yapılmış Aşılar (Daha Küçük Görünüm) */
        .vaccine-card.card-past {
            background-color: #f0fdf4 !important;
            border-color: #bbf7d0 !important;
            border-left: 4px solid #16a34a !important;
            padding: 0.85rem 1.15rem !important;
            gap: 0.4rem !important;
            transform: scale(0.96);
            opacity: 0.92;
        }
        .vaccine-card.card-past .card-icon {
            background-color: #dcfce7 !important;
            color: #16a34a !important;
            width: 32px !important;
            height: 32px !important;
            font-size: 0.95rem !important;
            border-radius: 6px !important;
        }
        .vaccine-card.card-past .card-content h3 {
            font-size: 0.92rem !important;
            margin-bottom: 0.15rem !important;
        }
        .vaccine-card.card-past .card-content p {
            font-size: 0.78rem !important;
            line-height: 1.35 !important;
            margin-bottom: 0.2rem !important;
        }
        .vaccine-card.card-past .dosage {
            background-color: #dcfce7 !important;
            color: #166534 !important;
            font-size: 0.72rem !important;
            padding: 1px 6px !important;
        }
        .vaccine-card.card-past .date-range {
            background-color: #dcfce7 !important;
            color: #15803d !important;
            border-color: #bbf7d0 !important;
            font-size: 0.78rem !important;
            padding: 4px 8px !important;
        }
        .vaccine-card.card-past .status-badge {
            font-size: 0.65rem !important;
            padding: 2px 6px !important;
            margin-bottom: 0.2rem !important;
        }

        /* Yapılacak / Güncel / Kritik Aşılar (1 Aylık Pencere Dahil) */
        .vaccine-card.card-due,
        .vaccine-card.card-critical {
            background-color: #fef2f2 !important;
            border-color: #fecaca !important;
            border-left: 5px solid #ef4444 !important;
            transform: scale(1.03);
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.18), 0 4px 6px -2px rgba(239, 68, 68, 0.06);
            position: relative;
            z-index: 2;
        }
        .vaccine-card.card-due .card-icon,
        .vaccine-card.card-critical .card-icon {
            background-color: #fee2e2 !important;
            color: #dc2626 !important;
        }
        .vaccine-card.card-due .dosage,
        .vaccine-card.card-critical .dosage {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
        }
        .vaccine-card.card-due .date-range,
        .vaccine-card.card-critical .date-range {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            border-color: #fecaca !important;
        }

        /* Kaçırılmış / Artık Yapılamaz Aşılar */
        .vaccine-card.card-expired {
            background-color: #f8fafc !important;
            border-color: #e2e8f0 !important;
            border-left: 5px solid #94a3b8 !important;
            opacity: 0.8;
            transform: scale(0.95);
        }
        .vaccine-card.card-expired .card-icon {
            background-color: #f1f5f9 !important;
            color: #64748b !important;
        }
        .vaccine-card.card-expired .card-content h3 {
            color: #64748b;
            text-decoration: line-through;
        }
        .vaccine-card.card-expired .status-badge {
            background-color: #f1f5f9 !important;
            color: #64748b !important;
        }

        .vaccine-card.special-card {
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.08);
        }

        .vaccine-card:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.12);
        }
        .vaccine-card.card-past:hover {
            transform: translateY(-2px) scale(0.97);
        }

        .card-top { display: flex; gap: 1rem; align-items: flex-start; }
        
        .card-icon {
            background-color: #eff6ff; color: var(--primary); width: 44px; height: 44px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
        }

        .status-badge {
            display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.6rem;
            border-radius: 9999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.03em; margin-bottom: 0.4rem;
        }
        .status-badge.badge-past { background-color: #dcfce7; color: #166534; }
        .status-badge.badge-critical { background-color: #fee2e2; color: #991b1b; }
        .status-badge.badge-due { background-color: #fee2e2; color: #b91c1c; }
        .status-badge.badge-expired { background-color: #f1f5f9; color: #475569; }
        .status-badge.badge-catchup { background-color: #ffedd5; color: #c2410c; }

        .section-divider {
            grid-column: 1 / -1;
            width: 100%;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.05rem;
            font-weight: 700;
        }
        .section-divider.active-divider {
            color: #991b1b;
            border-bottom-color: #fecaca;
            margin-top: 0.5rem;
        }
        .section-divider.past-divider {
            color: #166534;
            border-bottom-color: #bbf7d0;
            margin-top: 2.25rem;
        }

        .special-card .card-icon { background-color: #fef3c7; color: #d97706; }
        .card-content h3 { font-size: 1.05rem; color: var(--text-main); margin-bottom: 0.2rem; }
        .card-content p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 0.4rem; }
        .card-content .dosage { font-weight: 600; color: var(--primary); font-size: 0.8rem; display: inline-block; background: #eff6ff; padding: 2px 8px; border-radius: 4px; margin-top: 4px; }
        .special-card .card-content .dosage { color: #d97706; background: #fef3c7; }

        .date-range {
            font-size: 0.85rem; color: var(--primary); background: #f1f5f9;
            padding: 8px 12px; border-radius: 6px; display: flex; align-items: center;
            gap: 8px; font-weight: 500; border: 1px solid #e2e8f0; width: 100%;
        }
        .special-card .date-range { background: #fef3c7; color: #b45309; border-color: #fde68a; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: white; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); transform: scale(0.95); transition: transform 0.2s; overflow: hidden; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 1.2rem; }
        .close-btn { background: none; border: none; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; }
        .modal-body { padding: 1.5rem; }
        .modal-footer { padding: 1.5rem; background: #f8fafc; border-top: 1px solid var(--border); }
        
        .empty-state { text-align: center; padding: 3rem 1rem; grid-column: 1 / -1; }
        .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem; }
        .hidden { display: none !important; }

        #pdfExportArea { padding: 1rem; background: white; border-radius: 8px; }
        .pdf-title { display: none; text-align: center; color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        .warning-text { color: #dc2626; font-weight: 700; }
		
		/* PDF Mode Single Page Full Width Optimization */
        #pdfExportArea.pdf-mode,
        .pdf-mode#pdfExportArea {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 8px 10px !important;
            background: #ffffff !important;
            box-sizing: border-box !important;
            display: block !important;
            position: static !important;
            transform: none !important;
        }

        .pdf-mode .pdf-title {
            display: block !important;
            text-align: center !important;
            color: var(--primary) !important;
            font-size: 1.1rem !important;
            font-weight: 700 !important;
            margin-bottom: 6px !important;
            padding-bottom: 4px !important;
            border-bottom: 1.5px solid var(--border) !important;
            line-height: 1.25 !important;
        }

        .pdf-mode .pdf-title span {
            font-size: 0.76rem !important;
            color: #64748b !important;
            font-weight: normal !important;
        }

        .pdf-mode .section-divider {
            display: flex !important;
            width: 100% !important;
            margin-top: 6px !important;
            margin-bottom: 4px !important;
            padding-bottom: 2px !important;
            font-size: 0.78rem !important;
            border-bottom-width: 1.5px !important;
            page-break-after: avoid !important;
            box-sizing: border-box !important;
        }

        .pdf-mode .vaccine-grid { 
            display: flex !important; 
            flex-wrap: wrap !important; 
            justify-content: space-between !important;
            gap: 0 !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .pdf-mode .vaccine-card { 
            width: 48.8% !important;
            margin-bottom: 4px !important;
            padding: 5px 8px !important;
            gap: 2px !important;
            border-radius: 5px !important;
            box-shadow: none !important;
            transform: none !important;
            page-break-inside: avoid !important;
            box-sizing: border-box !important;
        }

        .pdf-mode .vaccine-card .card-top {
            display: flex !important;
            gap: 6px !important;
            align-items: flex-start !important;
        }

        .pdf-mode .vaccine-card .card-icon {
            width: 22px !important;
            height: 22px !important;
            font-size: 0.72rem !important;
            border-radius: 4px !important;
            flex-shrink: 0 !important;
        }

        .pdf-mode .vaccine-card .card-content {
            width: 100% !important;
        }

        .pdf-mode .vaccine-card .card-content h3 {
            font-size: 0.76rem !important;
            margin-bottom: 1px !important;
            line-height: 1.15 !important;
        }

        .pdf-mode .vaccine-card .card-content p {
            font-size: 0.64rem !important;
            line-height: 1.15 !important;
            margin-bottom: 1px !important;
        }

        .pdf-mode .vaccine-card .dosage {
            font-size: 0.6rem !important;
            padding: 1px 4px !important;
            margin-top: 1px !important;
            border-radius: 3px !important;
        }

        .pdf-mode .vaccine-card .date-range {
            font-size: 0.63rem !important;
            padding: 2px 5px !important;
            border-radius: 3px !important;
        }

        .pdf-mode .vaccine-card .status-badge {
            font-size: 0.55rem !important;
            padding: 1px 4px !important;
            margin-bottom: 1px !important;
            border-radius: 3px !important;
        }

        /* PDF Çıktısında Yapılmış Aşılar Sayfanın Altında 3 Sütunlu Kompakt Mini Kartlar */
        .pdf-mode .vaccine-card.card-past {
            width: 32.2% !important;
            padding: 3px 6px !important;
            margin-bottom: 3px !important;
            gap: 0 !important;
            border-left-width: 3px !important;
            border-radius: 4px !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            box-sizing: border-box !important;
            transform: none !important;
        }
        .pdf-mode .vaccine-card.card-past .card-top {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 5px !important;
            width: 100% !important;
        }
        .pdf-mode .vaccine-card.card-past .card-icon {
            width: 16px !important;
            height: 16px !important;
            font-size: 0.62rem !important;
            border-radius: 3px !important;
            flex-shrink: 0 !important;
        }
        .pdf-mode .vaccine-card.card-past .card-content {
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            overflow: hidden !important;
            width: 100% !important;
        }
        .pdf-mode .vaccine-card.card-past .card-content h3 {
            font-size: 0.68rem !important;
            margin: 0 !important;
            line-height: 1.1 !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }
        .pdf-mode .vaccine-card.card-past .card-content p,
        .pdf-mode .vaccine-card.card-past .dosage,
        .pdf-mode .vaccine-card.card-past .status-badge,
        .pdf-mode .vaccine-card.card-past .date-range {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <img src="https://ahef.org.tr/upload/files/8424122c-a4bd-41bb-badd-ecafbc8dd05d.png" alt="AHEF Logosu">
        <div class="header-text">
            <h1>AHEF Çocukluk Çağı Aşı Asistanı</h1>
            <p>Ulusal aşı takvimi, yakalama (catch-up) ve detaylı özel aşı algoritmaları</p>
        </div>
    </div>
    
    <div class="form-section">
        <div class="input-group">
            <label for="gender">Cinsiyet</label>
            <select id="gender">
                <option value="kiz">Kız </option>
                <option value="erkek">Erkek </option>
            </select>
        </div>

        <div class="input-group">
            <label for="vaccineStatus">Aşı Durumu</label>
            <select id="vaccineStatus">
                <option value="tam" selected>Tam Aşılı</option>
                <option value="eksik">Eksik Aşılı</option>
                <option value="hic">Hiç Aşılanmamış</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="ageType">Zaman Kriteri</label>
            <select id="ageType">
                <option value="ay">Ay Olarak</option>
                <option value="yas">Yaş Olarak</option>
                <option value="dob">Doğum Tarihi Seç</option>
            </select>
        </div>
        
        <div class="input-group" id="inputWrapper">
            <div id="numberInputArea">
                <label for="ageValue">Değer Giriniz</label>
                <input type="number" id="ageValue" min="0" value="0">
            </div>
            
            <div id="dobInputArea" class="hidden">
                <label>Doğum Tarihi</label>
                <button class="btn-secondary" id="openModalBtn">
                    <i class="fa-regular fa-calendar"></i> Tarih Seçiniz
                </button>
                <input type="hidden" id="calculatedMonths" value="0">
                <input type="hidden" id="rawDobValue" value="">
                <input type="hidden" id="selectedDateString" value="">
            </div>
        </div>

        <div class="toggle-wrapper">
            <label class="switch">
                <input type="checkbox" id="includeSpecial" checked>
                <span class="slider"></span>
            </label>
            <label for="includeSpecial" class="toggle-label">Özel Aşıları (Rota, Menenjit, HPV vb.) Takvime Dahil Et</label>
        </div>
        
        <button id="calculateBtn" class="btn-primary" style="grid-column: 1 / -1;">
            <i class="fa-solid fa-stethoscope"></i> Sorgula ve Takvim Oluştur
        </button>
    </div>

    <div class="results-section" id="resultsContainer">
        <!-- JS ile doldurulacak -->
    </div>
</div>
        
<div class="modal-overlay" id="dobModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Doğum Tarihi Seçin</h3>
            <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <input type="date" id="dobPicker">
        </div>
        <div class="modal-footer">
            <button class="btn-primary" id="confirmDobBtn">Tarihi Onayla</button>
        </div>
    </div>
</div>

<script>
    const routineVaccines = [
        { month: 0, name: "Hep-B (1. Doz)", desc: "Doğumda uygulanır.", code: "hepb_1" },
        { month: 2, name: "Hep-B (2. Doz)", desc: "2. Ay sonu rutin aşısı.", code: "hepb_2" },
        { month: 2, name: "BCG", desc: "Verem aşısı. 2. Ay sonu.", code: "bcg" },
        { month: 2, name: "KPA (1. Doz)", desc: "Konjuge Pnömokok Aşısı.", code: "kpa_1" },
        { month: 2, name: "DaBT-İPA-Hib-HepB (1. Doz)", desc: "5'li/6'lı Karma aşı.", code: "karma_1" },
        { month: 4, name: "KPA (2. Doz)", desc: "Konjuge Pnömokok Aşısı.", code: "kpa_2" },
        { month: 4, name: "DaBT-İPA-Hib-HepB (2. Doz)", desc: "5'li/6'lı Karma aşı.", code: "karma_2" },

            // >= 13 yaş
            catchUpList.push({
                name: "Suçiçeği (1. Telafi Dozu)",
                month: currentMonth,
                desc: "13 yaş üzeri adölesanlarda 2 doz uygulanır.",
                dosage: "Hemen 1. doz",
                icon: "fa-shield-virus",
                dateRange: `1. Doz: ${addMonths(baseDob, currentMonth)}`,
                statusType: 'critical'
            });
            catchUpList.push({
                name: "Suçiçeği (2. Telafi Dozu)",
                month: currentMonth + 1,
                desc: "1. dozdan en az 4-8 hafta sonra 2. doz.",
                dosage: "1. dozdan 1 ay sonra",
                icon: "fa-shield-virus",
                dateRange: `2. Doz: ${addMonths(baseDob, currentMonth + 1)}`,
                statusType: 'due'
            });
        }

        // 7. Hep-A (Hepatit A)
        if (currentMonth < 18) {
            catchUpList.push({
                name: "Hep-A (1. Doz)",
                month: 18,
                desc: "18. Ay rutin başlangıcı.",
                dosage: "18. ayda",
                icon: "fa-shield-virus",
                dateRange: `1. Doz: ${addMonths(baseDob, 18)}`,
                statusType: 'due'
            });
            catchUpList.push({
                name: "Hep-A (2. Doz)",
                month: 24,
                desc: "24. Ay rutin 2. dozu.",
                dosage: "24. ayda",
                icon: "fa-shield-virus",
                dateRange: `2. Doz: ${addMonths(baseDob, 24)}`,
                statusType: 'due'
            });
        } else {
            catchUpList.push({
                name: "Hep-A (1. Telafi Dozu)",
                month: currentMonth,
                desc: "18. ay sonrası kaçırılan Hepatit A aşısı.",
                dosage: "Hemen uygulanmalı",
                icon: "fa-shield-virus",
                dateRange: `1. Doz: ${addMonths(baseDob, currentMonth)}`,
                statusType: 'critical'
            });
            catchUpList.push({
                name: "Hep-A (2. Telafi Dozu)",
                month: currentMonth + 6,
                desc: "1. dozdan en az 6 ay sonra 2. doz uygulanır.",
                dosage: "1. dozdan 6 ay sonra",
                icon: "fa-shield-virus",
                dateRange: `2. Doz: ${addMonths(baseDob, currentMonth + 6)}`,
                statusType: 'due'
            });
        }

        // 8. OPA (Oral Polio)
        if (currentMonth >= 6 && currentMonth < 60) {
            catchUpList.push({
                name: "OPA (Oral Polio)",
                month: currentMonth,
                desc: "Çocuk felcine karşı oral canlı aşı pekiştirmesi.",
                dosage: "Hemen 2 damla oral",
                icon: "fa-shield-virus",
                dateRange: `Uygulama: ${addMonths(baseDob, currentMonth)}`,
                statusType: 'critical'
            });
        }

        // Özel Aşılar
        if (includeSpecial) {
            const specials = getSpecialVaccines(currentMonth, baseDob);
            specials.forEach(s => {
                catchUpList.push({
                    ...s,
                    statusType: s.isExpired ? 'expired' : (s.month === currentMonth ? 'critical' : 'due')
                });
            });
        }

        return catchUpList;
    };

    document.addEventListener("DOMContentLoaded", () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dobPicker').setAttribute('max', today);

        document.getElementById('ageType').addEventListener('change', (e) => {
            if (e.target.value === 'dob') {
                document.getElementById('numberInputArea').classList.add('hidden');
                document.getElementById('dobInputArea').classList.remove('hidden');
                document.getElementById('dobModal').classList.add('active');
            } else {
                document.getElementById('numberInputArea').classList.remove('hidden');
                document.getElementById('dobInputArea').classList.add('hidden');
            }
        });

        document.getElementById('openModalBtn').addEventListener('click', () => document.getElementById('dobModal').classList.add('active'));
        document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('dobModal').classList.remove('active'));
        
        document.getElementById('confirmDobBtn').addEventListener('click', () => {
            const dateVal = document.getElementById('dobPicker').value;
            if(!dateVal) return alert("Lütfen geçerli bir tarih seçin.");

            const birthDate = new Date(dateVal);
            const today = new Date();
            let months = (today.getFullYear() - birthDate.getFullYear()) * 12 + (today.getMonth() - birthDate.getMonth());
            if (today.getDate() < birthDate.getDate()) months--;
            months = Math.max(0, months);

            document.getElementById('calculatedMonths').value = months;
            document.getElementById('rawDobValue').value = dateVal;
            
            const formattedDate = birthDate.toLocaleDateString('tr-TR');
            document.getElementById('selectedDateString').value = formattedDate;
            
            const btn = document.getElementById('openModalBtn');
            btn.innerHTML = `<i class="fa-solid fa-calendar-check"></i> ${formattedDate} (${months} Aylık)`;
            btn.style.backgroundColor = 'var(--success-bg)';
            btn.style.color = 'var(--success-text)';
            document.getElementById('dobModal').classList.remove('active');
        });

        document.getElementById('calculateBtn').addEventListener('click', calculateVaccines);
        document.getElementById('vaccineStatus').addEventListener('change', calculateVaccines);
        calculateVaccines();
    });

    const calculateVaccines = () => {
        const ageType = document.getElementById('ageType').value;
        const gender = document.getElementById('gender').value;
        const vaccineStatus = document.getElementById('vaccineStatus').value; // 'tam', 'eksik', 'hic'
        const includeSpecial = document.getElementById('includeSpecial').checked;
        
        let totalMonths = 0;
        let badgeTextPrefix = "";
        let baseDob = new Date();

        if (ageType === 'yas') {
            const val = parseInt(document.getElementById('ageValue').value) || 0;
            totalMonths = val * 12;
            badgeTextPrefix = `${val} Yaş`;
            baseDob.setMonth(baseDob.getMonth() - totalMonths);
        } else if (ageType === 'ay') {
            const val = parseInt(document.getElementById('ageValue').value) || 0;
            totalMonths = val;
            badgeTextPrefix = `${val} Aylık`;
            baseDob.setMonth(baseDob.getMonth() - totalMonths);
        } else if (ageType === 'dob') {
            totalMonths = parseInt(document.getElementById('calculatedMonths').value) || 0;
            const rawDob = document.getElementById('rawDobValue').value;
            if (rawDob) baseDob = new Date(rawDob);
            
            const dobStr = document.getElementById('selectedDateString').value;
            badgeTextPrefix = dobStr ? `D.Tarihi: ${dobStr} (${totalMonths} Ay)` : `${totalMonths} Aylık`;
        }

        let processedVaccines = [];

        if (vaccineStatus === 'eksik' || vaccineStatus === 'hic') {
            // Catch-up / Yakalama Takvimi Algoritması
            processedVaccines = calculateCatchUpVaccines(totalMonths, baseDob, vaccineStatus, includeSpecial);
        } else {
            // Tam Aşılı Takvim (1 Aylık Pencere ve Geçmiş vs Gelecek Ayrımı)
            const addMonths = (date, m) => {
                const d = new Date(date);
                d.setMonth(d.getMonth() + m);
                return d.toLocaleDateString('tr-TR');
            };

            routineVaccines.forEach(v => {
                const targetDate = new Date(baseDob);
                targetDate.setMonth(targetDate.getMonth() + v.month);
                
                let statusType = 'past';
                
                if (v.month < totalMonths) {
                    // Geçmişte kalmış aşı
                    // 1 Aylık Yapılabilir Pencere Kuralı:
                    // Eğer currentMonth === vaccineMonth + 1 (yani tam 1 ay geçmişse), bu aşı kritik hemen yapılmalı penceresindedir
                    if (totalMonths === v.month + 1) {
                        statusType = 'critical';
                    } else {
                        statusType = 'past';
                    }
                } else if (v.month === totalMonths) {
                    // Tam o ayda olan aşı -> Kritik / Hemen Yapılmalı
                    statusType = 'critical';
                } else {
                    // Gelecekte yapılacak aşı
                    statusType = 'due';
                }

                processedVaccines.push({
                    ...v,
                    isSpecial: false,
                    statusType: statusType,
                    dateRange: `Planlanan Tarih: ${targetDate.toLocaleDateString('tr-TR')}`
                });
            });

            if (includeSpecial) {
                const specials = getSpecialVaccines(totalMonths, baseDob);
                specials.forEach(s => {
                    let statusType = 'critical';
                    if (s.isExpired) {
                        statusType = 'expired';
                    } else if (s.month < totalMonths) {
                        if (totalMonths === s.month + 1) {
                            statusType = 'critical';
                        } else {
                            statusType = 'past';
                        }
                    } else if (s.month === totalMonths) {
                        statusType = 'critical';
                    } else {
                        statusType = 'due';
                    }
                    processedVaccines.push({
                        ...s,
                        statusType: statusType
                    });
                });
            }
        }
        
        renderResults(processedVaccines, totalMonths, gender, vaccineStatus, badgeTextPrefix);
    };

    const renderResults = (vaccines, totalMonths, gender, vaccineStatus, badgeTextPrefix) => {
        const container = document.getElementById('resultsContainer');
        
        if (vaccines.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fa-regular fa-calendar-xmark"></i>
                    <h3>Bu Periyotta Aşı Bulunmuyor</h3>
                    <p>Seçilen kriterler için herhangi bir aşı kaydı oluşturulamadı.</p>
                </div>
            `;
            return;
        }

        // Sıralama Önceliği:
        // 1. Kritik / Hemen Yapılmalı (En Üstte)
        // 2. Planlanan / Yapılacak Aşılar (Ortada)
        // 3. Kaçırıldı / Süresi Geçti
        // 4. Geçmişte Yapılmış Aşılar (En Altta)
        const priorityOrder = { 'critical': 1, 'due': 2, 'expired': 3, 'past': 4 };
        vaccines.sort((a, b) => {
            const pA = priorityOrder[a.statusType] || 99;
            const pB = priorityOrder[b.statusType] || 99;
            if (pA !== pB) return pA - pB;
            return (a.month || 0) - (b.month || 0);
        });

        const activeVaccines = vaccines.filter(v => v.statusType !== 'past');
        const pastVaccines = vaccines.filter(v => v.statusType === 'past');

        const genderText = gender === 'kiz' ? 'Kız' : 'Erkek';
        const dateStr = new Date().toLocaleDateString('tr-TR');
        let statusLabel = 'Tam Aşılı';
        if (vaccineStatus === 'eksik') statusLabel = 'Eksik Aşılı (Yakalama Takvimi)';
        if (vaccineStatus === 'hic') statusLabel = 'Hiç Aşılanmamış (Hızlandırılmış Takvim)';

        container.innerHTML = `
            <div class="results-header">
                <div class="summary-badge">
                    <i class="fa-solid fa-clipboard-user"></i>
                    ${badgeTextPrefix} - ${genderText} Çocuğu (${statusLabel})
                </div>
                <button onclick="downloadPDF()" class="btn-pdf"><i class="fa-solid fa-file-pdf"></i> PDF Olarak İndir</button>
            </div>
            
            <div id="pdfExportArea">
                <h2 class="pdf-title">Çocukluk Çağı Aşı Takvimi Raporu <br><span style="font-size:0.9rem; color:#64748b;">Oluşturulma: ${dateStr} | Durum: ${statusLabel} | Hasta: ${badgeTextPrefix} ${genderText}</span></h2>
                <div class="vaccine-grid" id="vaccineGrid"></div>
            </div>
        `;

        const gridContainer = document.getElementById('vaccineGrid');

        const renderCard = (vaccine) => {
            let cardModClass = "";
            let statusBadgeHtml = "";
            let iconHtml = "";

            if (vaccine.statusType === 'past') {
                cardModClass = "card-past";
                iconHtml = '<i class="fa-solid fa-circle-check"></i>';
                statusBadgeHtml = '<span class="status-badge badge-past"><i class="fa-solid fa-check"></i> Tamamlandı (Geçmiş Doz)</span>';
            } else if (vaccine.statusType === 'critical') {
                cardModClass = "card-critical";
                iconHtml = '<i class="fa-solid fa-triangle-exclamation"></i>';
                statusBadgeHtml = '<span class="status-badge badge-critical"><i class="fa-solid fa-bolt"></i> Kritik / Hemen Yapılmalı</span>';
            } else if (vaccine.statusType === 'expired') {
                cardModClass = "card-expired";
                iconHtml = '<i class="fa-solid fa-ban"></i>';
                statusBadgeHtml = '<span class="status-badge badge-expired"><i class="fa-solid fa-circle-xmark"></i> Kaçırıldı / Artık Yapılamaz</span>';
            } else {
                // due / future
                cardModClass = "card-due";
                const customIcon = vaccine.icon ? vaccine.icon : "fa-syringe";
                iconHtml = `<i class="fa-solid ${customIcon}"></i>`;
                statusBadgeHtml = '<span class="status-badge badge-due"><i class="fa-regular fa-clock"></i> Planlanan / Yapılacak Aşı</span>';
            }

            if (vaccine.isSpecial && vaccine.statusType !== 'expired') {
                cardModClass += " special-card";
            }

            const dosageHtml = vaccine.dosage ? `<span class="dosage">${vaccine.dosage}</span>` : '';
            const dateHtml = vaccine.dateRange ? `<div class="date-range"><i class="fa-regular fa-calendar-days"></i> ${vaccine.dateRange}</div>` : '';
            
            return `
                <div class="vaccine-card ${cardModClass}">
                    ${statusBadgeHtml}
                    <div class="card-top">
                        <div class="card-icon">${iconHtml}</div>
                        <div class="card-content">
                            <h3>${vaccine.name}</h3>
                            <p>${vaccine.desc}</p>
                            ${dosageHtml}
                        </div>
                    </div>
                    ${dateHtml}
                </div>
            `;
        };

        let html = "";
        if (activeVaccines.length > 0 && pastVaccines.length > 0) {
            html += `<div class="section-divider active-divider"><i class="fa-solid fa-bell"></i> Kritik ve Yapılacak Aşılar (${activeVaccines.length})</div>`;
            activeVaccines.forEach(v => { html += renderCard(v); });
            html += `<div class="section-divider past-divider"><i class="fa-solid fa-clock-rotate-left"></i> Geçmişte Yapılmış Aşılar (${pastVaccines.length})</div>`;
            pastVaccines.forEach(v => { html += renderCard(v); });
        } else {
            vaccines.forEach(v => { html += renderCard(v); });
        }

        gridContainer.innerHTML = html;
    };

    const downloadPDF = () => {
        const element = document.getElementById('pdfExportArea');
        const title = element.querySelector('.pdf-title');
        
        title.style.display = 'block';
        element.classList.add('pdf-mode');

        const opt = {
            margin:       [8, 8, 8, 8],
            filename:     'asi-takvimi-raporu.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2, 
                useCORS: true, 
                letterRendering: true, 
                scrollY: 0,
                scrollX: 0
            },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            title.style.display = 'none';
            element.classList.remove('pdf-mode');
        }).catch(err => {
            console.error("PDF oluşturma hatası:", err);
            title.style.display = 'none';
            element.classList.remove('pdf-mode');
        });
    };
</script>
</body>
</html>
