<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHEF Çocukluk Çağı Aşı Asistanı - V2</title>
    <!-- FontAwesome Entegrasyonu -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --warning-bg: #fef9c3;
            --warning-text: #854d0e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .dashboard-container {
            background-color: var(--surface);
            width: 100%;
            max-width: 1000px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            padding: 2rem;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .header p { color: #bfdbfe; font-size: 0.95rem; }

        .form-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
        }

        select, input {
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            width: 100%;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            height: 48px;
            width: 100%;
        }

        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            height: 48px;
            width: 100%;
        }

        .btn-secondary:hover { background-color: #cbd5e1; }

        .results-section {
            padding: 2rem;
            background-color: #f8fafc;
        }

        .summary-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background-color: #e0e7ff;
            color: #3730a3;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        /* Kartların Grid Yapısı */
        .vaccine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .vaccine-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            gap: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .vaccine-card::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 4px; background-color: var(--primary);
        }

        .vaccine-card.special-card::before { background-color: #f59e0b; }
        .vaccine-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        .card-icon {
            background-color: #eff6ff;
            color: var(--primary);
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .special-card .card-icon { background-color: #fef3c7; color: #d97706; }

        .card-content h3 { font-size: 1.05rem; color: var(--text-main); margin-bottom: 0.3rem; }
        .card-content p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        /* Pop-up Modal CSS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none; /* Varsayılan olarak gizli */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 { font-size: 1.2rem; }
        
        .close-btn {
            background: none; border: none; font-size: 1.2rem;
            color: var(--text-muted); cursor: pointer;
        }
        .close-btn:hover { color: var(--text-main); }

        .modal-body { padding: 1.5rem; }
        .modal-footer { padding: 1.5rem; background: #f8fafc; border-top: 1px solid var(--border); }

        /* Empty State Utilities */
        .empty-state { text-align: center; padding: 3rem 1rem; grid-column: 1 / -1; }
        .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem; }
        .empty-state h3 { color: var(--text-main); margin-bottom: 0.5rem; }
        .empty-state p { color: var(--text-muted); max-width: 400px; margin: 0 auto 1.5rem auto; line-height: 1.5; }
        .next-appointment { background-color: var(--success-bg); color: var(--success-text); padding: 1rem; border-radius: 8px; display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 500; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>Çocukluk Çağı Aşı Asistanı</h1>
        <p>Ulusal aşı takvimi ve özel aşı algoritmaları</p>
    </div>
    
    <div class="form-section">
        <div class="input-group">
            <label for="gender">Cinsiyet</label>
            <select id="gender">
                <option value="kiz">Kız </option>
                <option value="erkek">Erkek </option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="ageType">Zaman Kriteri</label>
            <select id="ageType">
                <option value="ay">Ay Olarak</option>
                <option value="yas">Yaş Olarak</option>
                <option value="dob">Doğum Tarihi Seç</option>
            </select>
        </div>
        
        <div class="input-group" id="inputWrapper">
            <!-- Normal sayı girişi -->
            <div id="numberInputArea">
                <label for="ageValue" id="ageValueLabel">Değer Giriniz</label>
                <input type="number" id="ageValue" min="0" value="0">
            </div>
            
            <!-- Doğum tarihi seçildiğinde görünecek alan -->
            <div id="dobInputArea" class="hidden">
                <label>Doğum Tarihi</label>
                <button class="btn-secondary" id="openModalBtn">
                    <i class="fa-regular fa-calendar"></i> Tarih Seçiniz
                </button>
                <input type="hidden" id="calculatedMonths" value="0">
                <input type="hidden" id="selectedDateString" value="">
            </div>
        </div>
        
        <button id="calculateBtn" class="btn-primary">
            <i class="fa-solid fa-stethoscope"></i> Sorgula
        </button>
    </div>

    <div class="results-section" id="resultsContainer">
        <!-- JS ile dinamik render edilecek -->
    </div>
</div>

<!-- DOĞUM TARİHİ MODALI -->
<div class="modal-overlay" id="dobModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Doğum Tarihi Seçin</h3>
            <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <label style="font-size: 0.875rem; font-weight: 600; margin-bottom:0.5rem; display:block;">Takvimden Seçiniz</label>
            <input type="date" id="dobPicker">
        </div>
        <div class="modal-footer">
            <button class="btn-primary" id="confirmDobBtn">
                <i class="fa-solid fa-check"></i> Tarihi Onayla
            </button>
        </div>
    </div>
</div>

<script>
    /**
     * SENIOR DEV NOTU:
     * Aşılar "Atomik" hale getirildi. Artık aynı ayda olan her aşının kendi objesi var.
     * Döngü çalışırken hepsi için otomatik olarak ayrı kart render edilecek.
     */
    const vaccineData = [
        { month: 0, name: "Hep-B (1. Doz)", desc: "Doğumda uygulanır.", isSpecial: false },

        { month: 2, name: "Hep-B (2. Doz)", desc: "2. Ay sonu rutin aşısı.", isSpecial: false },
        { month: 2, name: "BCG", desc: "Verem aşısı. 2. Ay sonu rutin aşısı.", isSpecial: false },
        { month: 2, name: "KPA (1. Doz)", desc: "Konjuge Pnömokok Aşısı. 2. Ay sonu.", isSpecial: false },
        { month: 2, name: "DaBT-İPA-Hib-HepB (1. Doz)", desc: "5'li Karma aşı. 2. Ay sonu.", isSpecial: false },

        { month: 4, name: "KPA (2. Doz)", desc: "Konjuge Pnömokok Aşısı. 4. Ay sonu.", isSpecial: false },
        { month: 4, name: "DaBT-İPA-Hib-HepB (2. Doz)", desc: "5'li Karma aşı. 4. Ay sonu.", isSpecial: false },

        { month: 6, name: "DaBT-İPA-Hib-HepB (3. Doz)", desc: "5'li Karma aşı. 6. Ay sonu.", isSpecial: false },
        { month: 6, name: "OPA (1. Doz)", desc: "Oral Polio Aşısı. 6. Ay sonu.", isSpecial: false },
        { month: 6, name: "Meningokok (6. Ay Senaryosu)", desc: "Daha önce aşılanmadıysa konjuge veya rekombinant aşı planlaması başlatılır.", isSpecial: true },

        { month: 9, name: "KKK (Ek Doz)", desc: "Kızamık, Kızamıkçık, Kabakulak ek dozu.", isSpecial: false },

        { month: 12, name: "KPA (Rapel)", desc: "Konjuge Pnömokok Pekiştirme. 12. Ay sonu.", isSpecial: false },
        { month: 12, name: "Suçiçeği", desc: "1 Yaş rutin aşısı.", isSpecial: false },
        { month: 12, name: "KKK (1. Doz)", desc: "Kızamık, Kızamıkçık, Kabakulak. 1 Yaş.", isSpecial: false },
        { month: 12, name: "Meningokok (12. Ay Senaryosu)", desc: "12 aylık veya büyük ve aşılanmadıysa aşılama planlanabilir.", isSpecial: true },

        { month: 18, name: "DaBT-İPA-Hib-HepB (Rapel)", desc: "5'li Karma aşı pekiştirme dozu.", isSpecial: false },
        { month: 18, name: "OPA (2. Doz)", desc: "Oral Polio Aşısı pekiştirme.", isSpecial: false },
        { month: 18, name: "Hep-A (1. Doz)", desc: "Hepatit A aşısı başlangıcı.", isSpecial: false },

        { month: 24, name: "Hep-A (2. Doz)", desc: "Hepatit A aşısı ikinci dozu. 2 Yaş.", isSpecial: false },
        { month: 24, name: "Meningokok (24. Ay Senaryosu)", desc: "24 aylık veya büyükse hekim kontrolünde başlatılabilir.", isSpecial: true },

        { month: 48, name: "DaBT-İPA (Rapel)", desc: "4'lü Karma aşı pekiştirme. 4 Yaş.", isSpecial: false },
        { month: 48, name: "KKK (2. Doz)", desc: "Kızamık, Kızamıkçık, Kabakulak. 4 Yaş.", isSpecial: false },

        { month: 156, name: "Td (Rapel)", desc: "Erişkin Tetanos Difteri. 13 Yaş pekiştirme dozu.", isSpecial: false }
    ];

    const getRangeVaccines = (monthAge) => {
        const ranges = [];
        if (monthAge >= 1 && monthAge <= 7) {
            ranges.push({ name: "Rotavirüs", desc: "Monovalan veya Pentavalan uygulaması.", isSpecial: true, icon: "fa-shield-virus" });
        }
        if (monthAge >= 108 && monthAge <= 168) {
            ranges.push({ name: "HPV (9-14 Yaş)", desc: "6-12 ay arayla 2 DOZ uygulanır.", isSpecial: true, icon: "fa-vial" });
        }
        if (monthAge >= 180) {
            ranges.push({ name: "HPV (15+ Yaş)", desc: "6 ay boyunca 3 DOZ gereklidir.", isSpecial: true, icon: "fa-vial" });
        }
        return ranges;
    };

    // --- DOM ELEMENTLERİ VE OLAY DİNLEYİCİLERİ ---
    document.addEventListener("DOMContentLoaded", () => {
        // Date input max değerini bugüne ayarla (Gelecekten doğmuş bebek seçilmesin)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dobPicker').setAttribute('max', today);

        // Dinleyiciler
        document.getElementById('ageType').addEventListener('change', handleTypeChange);
        document.getElementById('openModalBtn').addEventListener('click', openModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('confirmDobBtn').addEventListener('click', confirmDob);
        document.getElementById('calculateBtn').addEventListener('click', calculateVaccines);
        
        // Modal dışına tıklandığında kapanma
        document.getElementById('dobModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        calculateVaccines(); // İlk yüklemede varsayılan 0 değerini hesapla
    });

    // --- MODAL VE TİP DEĞİŞİMİ MANTIĞI ---
    const handleTypeChange = (e) => {
        const type = e.target.value;
        const numInput = document.getElementById('numberInputArea');
        const dobInput = document.getElementById('dobInputArea');

        if (type === 'dob') {
            numInput.classList.add('hidden');
            dobInput.classList.remove('hidden');
            openModal(); // Seçer seçmez otomatik aç
        } else {
            numInput.classList.remove('hidden');
            dobInput.classList.add('hidden');
        }
    };

    const openModal = () => document.getElementById('dobModal').classList.add('active');
    const closeModal = () => document.getElementById('dobModal').classList.remove('active');

    const confirmDob = () => {
        const dateVal = document.getElementById('dobPicker').value;
        if(!dateVal) {
            alert("Lütfen geçerli bir doğum tarihi seçiniz.");
            return;
        }

        const birthDate = new Date(dateVal);
        const today = new Date();
        
        // Yaşı ay olarak hesaplama algoritması
        let months = (today.getFullYear() - birthDate.getFullYear()) * 12;
        months -= birthDate.getMonth();
        months += today.getMonth();
        if (today.getDate() < birthDate.getDate()) {
            months--; // Gün olarak henüz o ayı doldurmadıysa
        }
        
        months = months < 0 ? 0 : months; // Eksi çıkmasını engelle

        // Verileri gizli inputlara yaz ve butonu güncelle
        document.getElementById('calculatedMonths').value = months;
        const formattedDate = birthDate.toLocaleDateString('tr-TR');
        document.getElementById('selectedDateString').value = formattedDate;
        
        document.getElementById('openModalBtn').innerHTML = `<i class="fa-solid fa-calendar-check"></i> ${formattedDate} (${months} Aylık)`;
        document.getElementById('openModalBtn').style.backgroundColor = 'var(--success-bg)';
        document.getElementById('openModalBtn').style.color = 'var(--success-text)';

        closeModal();
    };


    // --- HESAPLAMA VE EKRANA BASMA ---
    const calculateVaccines = () => {
        const ageType = document.getElementById('ageType').value;
        const gender = document.getElementById('gender').value;
        let totalMonths = 0;
        let badgeTextPrefix = "";

        if (ageType === 'yas') {
            const val = parseInt(document.getElementById('ageValue').value) || 0;
            totalMonths = val * 12;
            badgeTextPrefix = `${val} Yaş`;
        } else if (ageType === 'ay') {
            const val = parseInt(document.getElementById('ageValue').value) || 0;
            totalMonths = val;
            badgeTextPrefix = `${val} Aylık`;
        } else if (ageType === 'dob') {
            totalMonths = parseInt(document.getElementById('calculatedMonths').value) || 0;
            const dobStr = document.getElementById('selectedDateString').value;
            badgeTextPrefix = dobStr ? `D.Tarihi: ${dobStr} (${totalMonths} Aylık)` : `${totalMonths} Aylık`;
        }
        
        const exactMatches = vaccineData.filter(v => v.month === totalMonths);
        const rangeMatches = getRangeVaccines(totalMonths);
        const allMatches = [...exactMatches, ...rangeMatches];
        
        renderResults(allMatches, totalMonths, gender, badgeTextPrefix);
    };

    const renderResults = (vaccines, totalMonths, gender, badgeTextPrefix) => {
        const container = document.getElementById('resultsContainer');
        container.innerHTML = ''; 

        if (vaccines.length === 0) {
            const nextVaccine = vaccineData.find(v => v.month > totalMonths);
            let nextDisplay = nextVaccine ? (nextVaccine.month >= 12 && nextVaccine.month % 12 === 0 ? `${nextVaccine.month / 12} Yaşı` : `${nextVaccine.month}. Ayı`) : '';

            container.innerHTML = `
                <div class="empty-state">
                    <i class="fa-regular fa-calendar-xmark"></i>
                    <h3>Rutin Aşı Bulunmuyor</h3>
                    <p>Girilen periyot için ulusal takvimde tanımlı rutin bir aşı noktası saptanmadı.</p>
                    ${nextVaccine ? `<div class="next-appointment"><i class="fa-solid fa-clock-rotate-left"></i> Sonraki rutin aşılama: <strong>${nextDisplay}</strong></div>` : ''}
                </div>
            `;
            return;
        }

        const genderText = gender === 'kiz' ? 'Kız' : 'Erkek';
        
        // Özet Etiketi (Badge)
        container.innerHTML = `
            <div class="summary-badge">
                <i class="fa-solid fa-clipboard-user"></i>
                ${badgeTextPrefix} - ${genderText} için Aşı Planı
            </div>
            <div class="vaccine-grid" id="vaccineGrid"></div>
        `;

        const gridContainer = document.getElementById('vaccineGrid');

        // Ayrı ayrı kartları basıyoruz
        vaccines.forEach(vaccine => {
            const cardClass = vaccine.isSpecial ? "vaccine-card special-card" : "vaccine-card";
            const iconClass = vaccine.icon ? vaccine.icon : "fa-syringe";
            
            gridContainer.innerHTML += `
                <div class="${cardClass}">
                    <div class="card-icon"><i class="fa-solid ${iconClass}"></i></div>
                    <div class="card-content">
                        <h3>${vaccine.name}</h3>
                        <p>${vaccine.desc}</p>
                    </div>
                </div>
            `;
        });
    };
</script>
</body>
</html>
