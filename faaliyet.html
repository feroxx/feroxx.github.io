<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>AHEF Faaliyet Raporları</title>
  <!-- Swiper.js (Mobil Dokunmatik Kaydırma Motoru) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- Font Awesome & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --border: #e2e8f0;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      line-height: 1.5;
    }

    .container {
      max-width: 580px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    /* Büyük Kart Vitrini */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .report-card:active {
      transform: scale(0.985);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    /* Kapak Önizleme Alanı */
    .cover-wrap {
      width: 100%;
      height: 220px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }

    .report-card:hover .cover-img {
      transform: scale(1.02);
    }

    .badge-pages {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .badge-period {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(2, 132, 199, 0.92);
      backdrop-filter: blur(4px);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.3px;
    }

    /* Kart İçeriği */
    .card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.35;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .btn-view {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #f1f5f9;
      color: #0369a1;
      padding: 11px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 4px;
      transition: background-color 0.15s;
    }

    .report-card:active .btn-view {
      background: #e2e8f0;
    }

    /* Tam Ekran Dokunmatik Slayt Modalı */
    .slider-modal {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .slider-modal.active {
      display: flex;
    }

    .slider-topbar {
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: 12px;
      padding-left: 16px;
      padding-right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .slider-title {
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .slider-counter {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 700;
      background: rgba(255,255,255,0.1);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .btn-close-slider {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .btn-close-slider:active {
      background: rgba(255,255,255,0.3);
    }

    /* Swiper Slider */
    .swiper {
      width: 100%;
      flex: 1;
    }

    .swiper-slide {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000000;
    }

    .swiper-zoom-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .swiper-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="header-badge">
        <i class="fa-solid fa-bolt"></i> HIZLI SUNUM MODU
      </div>
      <h1>AHEF Faaliyet Raporları</h1>
      <p>İncelemek istediğiniz döneme dokunarak sayfalar arasında hızla gezinin</p>
    </header>

    <main class="list-container" id="cardsContainer"></main>
  </div>

  <!-- Tam Ekran Dokunmatik Slayt Modalı -->
  <div class="slider-modal" id="sliderModal">
    <div class="slider-topbar">
      <span class="slider-title" id="sliderTitle">Rapor Başlığı</span>
      <span class="slider-counter" id="sliderCounter">1 / 1</span>
      <button class="btn-close-slider" id="closeSliderBtn" aria-label="Kapat"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="swiper" id="reportSwiper">
      <div class="swiper-wrapper" id="swiperWrapper"></div>
    </div>
  </div>

  <script>
    // Rapor Listesi ve Dönüştürülen JPG Sayfaları
    const reports = [
      {
        id: "2026_ocak_subat_mart",
        title: "2026 OCAK - ŞUBAT - MART FAALİYET RAPORU",
        period: "1. ÇEYREK 2026",
        pageCount: 64,
        cover: "raporlar/2026_ocak_subat_mart/sayfa_01.jpg",
        desc: "Bakanlık görüşmeleri, TBMM ziyareti, AHEF Akademi eğitimleri ve deprem bölgesi saha ziyaretleri.",
        folder: "raporlar/2026_ocak_subat_mart"
      },
      {
        id: "2026_nisan_mayis_haziran",
        title: "2026 NİSAN - MAYIS - HAZİRAN FAALİYET RAPORU",
        period: "2. ÇEYREK 2026",
        pageCount: 35,
        cover: "raporlar/2026_nisan_mayis_haziran/sayfa_01.jpg",
        desc: "Dönemsel komisyon kazanımları, hukuki süreçler ve birinci basamak sağlık politikası raporları.",
        folder: "raporlar/2026_nisan_mayis_haziran"
      },
      {
        id: "2025_ekim_kasim_aralik",
        title: "2025 EKİM - KASIM - ARALIK FAALİYET RAPORU",
        period: "4. ÇEYREK 2025",
        pageCount: 18,
        cover: "raporlar/2025_ekim_kasim_aralik/sayfa_01.jpg",
        desc: "AHEF Yönetim Kurulu 2025 yılı son çeyrek hukuki kazanımları, basın açıklamaları ve komisyon raporları.",
        folder: "raporlar/2025_ekim_kasim_aralik"
      },
      {
        id: "deprem_bolgeleri_raporu",
        title: "DEPREM BÖLGELERİ FAALİYET VE SAHA RAPORU",
        period: "ÖZEL SAHA RAPORU",
        pageCount: 13,
        cover: "raporlar/deprem_bolgeleri_raporu/sayfa_01.jpg",
        desc: "Hatay, Kahramanmaraş ve Malatya konteyner ASM ziyaretleri, hekim sorunları ve çözüm önerileri.",
        folder: "raporlar/deprem_bolgeleri_raporu"
      }
    ];

    let swiperInstance = null;
    const cardsContainer = document.getElementById('cardsContainer');
    const modal = document.getElementById('sliderModal');
    const sliderTitle = document.getElementById('sliderTitle');
    const sliderCounter = document.getElementById('sliderCounter');
    const swiperWrapper = document.getElementById('swiperWrapper');
    const closeBtn = document.getElementById('closeSliderBtn');

    // Kartları Render Et
    function renderCards() {
      cardsContainer.innerHTML = reports.map(r => `
        <article class="report-card" onclick="openReport('${r.id}')">
          <div class="cover-wrap">
            <span class="badge-pages"><i class="fa-regular fa-clone"></i> ${r.pageCount} Sayfa</span>
            <span class="badge-period">${r.period}</span>
            <img class="cover-img" src="${r.cover}" alt="${r.title}">
          </div>
          <div class="card-body">
            <h2 class="card-title">${r.title}</h2>
            <p class="card-desc">${r.desc}</p>
            <div class="btn-view">
              <i class="fa-solid fa-book-open-reader"></i> Slayt Olarak İncele
            </div>
          </div>
        </article>
      `).join('');
    }

    // Slayt Modalı Başlat (Lazy Loading ile anında açılır)
    function openReport(reportId) {
      const report = reports.find(r => r.id === reportId);
      if (!report) return;

      sliderTitle.textContent = report.title;
      sliderCounter.textContent = `1 / ${report.pageCount}`;

      // Sayfa img elemanlarını oluştur
      const pageImages = Array.from({length: report.pageCount}, (_, i) => {
        const pageNum = String(i + 1).padStart(2, '0');
        return `${report.folder}/sayfa_${pageNum}.jpg`;
      });

      swiperWrapper.innerHTML = pageImages.map(imgUrl => `
        <div class="swiper-slide">
          <div class="swiper-zoom-container">
            <img src="${imgUrl}" loading="lazy" alt="Rapor Sayfası">
          </div>
        </div>
      `).join('');

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';

      if (swiperInstance) {
        swiperInstance.destroy();
      }
      
      swiperInstance = new Swiper('#reportSwiper', {
        speed: 250,
        spaceBetween: 10,
        zoom: {
          maxRatio: 3,
        },
        keyboard: {
          enabled: true,
        },
        on: {
          slideChange: function () {
            sliderCounter.textContent = `${this.activeIndex + 1} / ${report.pageCount}`;
          }
        }
      });
    }

    function closeReport() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      if (swiperInstance) {
        swiperInstance.destroy();
        swiperInstance = null;
      }
    }

    closeBtn.addEventListener('click', closeReport);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeReport();
      }
    });

    renderCards();
  </script>
</body>
</html>
